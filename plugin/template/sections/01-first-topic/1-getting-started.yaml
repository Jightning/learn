title: Getting started
blocks:
  - t: p
    h: |-
      <p>Open with the idea the reader needs next. Connect it to something they
      already know, then explain the reason for the new step rather than asking
      them to accept a rule without its conditions.</p>

  - t: key
    source: unverified
    h: |-
      <p>State the essential claim here and develop its meaning in the same
      reading path. Use inline math such as <m>x^2</m> where the expression is
      part of the sentence.</p>
      <p class="equation"><m>\displaystyle x^2 + y^2 = r^2</m></p>
      <p>Explain what the equation says, when it applies, and how it connects
      to the preceding idea.</p>

  - t: note
    optional: true
    follows: true
    h: |-
      <p>Use an optional follow-up for context or a useful extension that the
      learner can skip without losing a required step.</p>

quiz:
  # For a small, self-contained course, a typed question may live inline.
  # For repeated practice or reuse, store the item in questions/bank.yaml and
  # reference its stable ID here instead.
  - type: Explain the relationship
    concept: example-concept
    q: What relationship does the example equation express?
    response:
      kind: self
      model: It relates x and y values whose squared sum is the fixed value r squared.
    verified: true
