version: 1
batching:
  target_size: 4
stages:
  plan:
    phase: plan
    paired_role: planner
    action: Inventory sources and problem families; plan prerequisite order, essential reasoning and representation jobs in lesson teaching briefs; write categorize definitions and the compact materials/plan.yaml schedule. Hand off paths to the writer in paired mode.
  migrate:
    phase: write
    paired_role: writer
    action: Mechanically migrate existing planning artifacts to plan.yaml; preserve approved scope and progress, and flag ambiguous mappings for planner judgment.
  setup:
    phase: write
    paired_role: writer
    action: Use the plan and categorize lists to create course metadata, reader-facing concept bodies and subsection files; run author write and author index to record setup and stable IDs.
  write:
    phase: write
    paired_role: writer
    action: Run author batch; write assigned members in prerequisite order with connected explanations, representations, practice, verified answers and checked done. Inspect assembled passages; smoke-check unfamiliar formats locally. Complete all course writing before review; batches only bound writer context.
  review:
    phase: review
    paired_role: reviewer
    action: Screen sections compactly; use full packets for source and math judgments; review answer evidence, high-risk claims and family samples; save one consolidated issues report before corrections.
  correct:
    phase: write
    paired_role: writer
    action: Apply saved corrections, verify affected answers, run corrected with a separate results report and checked done --all, then return for reviewer recheck.
  finish:
    phase: review
    paired_role: reviewer
    action: Screen changed items and affected context, record acceptance with reviewed, then run global coverage and reader checks once; finish, audit and pack.
  complete:
    phase: review
    paired_role: reviewer
    action: Structural finish is recorded; report review evidence and remaining uncertainty. Reopen requested revisions with author redo.
