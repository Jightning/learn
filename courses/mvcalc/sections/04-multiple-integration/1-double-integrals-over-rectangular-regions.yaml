title: Double Integrals over Rectangular Regions
blocks:
  - t: p
    h: <p>In single-variable calculus, the definite integral <m>\int_a^b f(x)\,dx</m> measures the signed area trapped under the curve <m>y = f(x)</m> over an interval <m>[a, b]</m>. To compute volumes under surfaces <m>z = f(x, y)</m> in three-dimensional space, we generalize this construction to two independent variables defined over a planar region. We begin with a rectangular domain <m>R = [a, b] \times [c, d] = \{(x, y) \in \mathbb{R}^2 \mid a \le x \le b, \, c \le y \le d\}</m>, partitioning the rectangle into a grid of smaller subrectangles and summing the volumes of approximating rectangular columns.</p>
    authorId: block-70947daf-bb8
  - t: def
    term: Double Integral over a Rectangular Region
    source: OpenStax Calculus Volume 3, Section 5.1
    sourceReview: sourced
    core: 'The double integral of <m>f(x, y)</m> over a closed rectangle <m>R</m> is the limiting value of Riemann sums across refined subrectangle grids as subrectangle diameters approach zero.'
    introduces:
      - obj-s4-1
      - double-integral
    objectives:
      - obj-s4-1
    family: family-riemann-double
    h: <p>Let <m>R = [a, b] \times [c, d]</m>. Subdivide <m>[a, b]</m> into <m>m</m> subintervals of equal width <m>\Delta x = (b - a)/m</m> and <m>[c, d]</m> into <m>n</m> subintervals of equal width <m>\Delta y = (d - c)/n</m>. These form <m>mn</m> subrectangles <m>R_{ij} = [x_{i-1}, x_i] \times [y_{j-1}, y_j]</m>, each having area <m>\Delta A = \Delta x \Delta y</m>. Choosing a sample point <m>(x_{ij}^*, y_{ij}^*) \in R_{ij}</m>, the Riemann sum is <m>\sum_{i=1}^m \sum_{j=1}^n f(x_{ij}^*, y_{ij}^*)\,\Delta A</m>. If <m>f</m> is continuous on <m>R</m>, the limit as <m>m, n \to \infty</m> exists and defines the double integral <m>\iint_R f(x, y)\,dA</m>. When <m>f(x, y) \ge 0</m>, this integral equals the volume of the solid lying beneath the surface <m>z = f(x, y)</m> and above <m>R</m>.</p>
    authorId: block-e09bbac8-d1c
  - t: ex
    title: Estimating a Double Integral with the Midpoint Rule
    objectives:
      - obj-s4-1
    family: family-riemann-double
    h: '<p>Estimate <m>\iint_R (x + 2y^2)\,dA</m> over <m>R = [0, 2] \times [0, 4]</m> using a <m>2 \times 2</m> grid (<m>m = 2, n = 2</m>) with sample points evaluated at the subrectangle midpoints.</p><p>First determine grid spacings: <m>\Delta x = \frac{2 - 0}{2} = 1</m> with <m>x</m>-subintervals <m>[0, 1]</m> and <m>[1, 2]</m>, giving midpoints <m>x_1^* = 0.5</m> and <m>x_2^* = 1.5</m>. Next, <m>\Delta y = \frac{4 - 0}{2} = 2</m> with <m>y</m>-subintervals <m>[0, 2]</m> and <m>[2, 4]</m>, giving midpoints <m>y_1^* = 1</m> and <m>y_2^* = 3</m>. The subrectangle area is <m>\Delta A = \Delta x \Delta y = (1)(2) = 2</m>.</p><p>Evaluate <m>f(x, y) = x + 2y^2</m> at the four midpoints:</p><ul><li><m>f(0.5, 1) = 0.5 + 2(1)^2 = 2.5</m></li><li><m>f(1.5, 1) = 1.5 + 2(1)^2 = 3.5</m></li><li><m>f(0.5, 3) = 0.5 + 2(3)^2 = 18.5</m></li><li><m>f(1.5, 3) = 1.5 + 2(3)^2 = 19.5</m></li></ul><p>Summing these evaluations yields <m>2.5 + 3.5 + 18.5 + 19.5 = 44</m>. Multiplying by <m>\Delta A = 2</m> gives the Riemann estimate: <m>\sum_{i=1}^2 \sum_{j=1}^2 f(x_i^*, y_j^*)\Delta A = 44 \times 2 = 88</m>.</p>'
    authorId: block-2f505800-00c
  - t: def
    term: Fubini's Theorem for Rectangular Regions
    source: "OpenStax Calculus Volume 3, Section 5.1"
    sourceReview: sourced
    core: 'If <m>f(x, y)</m> is continuous on the rectangular region <m>R = [a, b] \times [c, d]</m>, the double integral evaluates to the iterated integral in either order of integration.'
    introduces:
      - fubini-theorem
    objectives:
      - obj-s4-1
    family: family-iterated-rectangle
    h: <p>Calculating limits of Riemann sums directly is impractical for general functions. Fubini's theorem reduces a two-dimensional double integral to two successive single-variable integrals, known as an iterated integral. When integrating with respect to <m>y</m> first, the variable <m>x</m> is held constant, computing the cross-sectional area <m>A(x) = \int_c^d f(x, y)\,dy</m> perpendicular to the <m>x</m>-axis. Integrating <m>A(x)</m> from <m>x = a</m> to <m>x = b</m> produces the total volume. Reversing the order integrates slices <m>A(y) = \int_a^b f(x, y)\,dx</m> along the <m>y</m>-axis from <m>c</m> to <m>d</m>, producing the identical value.</p>
    authorId: block-80628228-fe8
  - t: math
    label: Equivalence of Iterated Integrals under Fubini's Theorem
    tex: \iint_R f(x, y)\,dA = \int_a^b \left[ \int_c^d f(x, y)\,dy \right] dx = \int_c^d \left[ \int_a^b f(x, y)\,dx \right] dy
    note: 'Both integration orders yield the same result when <m>f</m> is continuous on <m>R = [a, b] \times [c, d]</m>.'
    objectives:
      - obj-s4-1
    family: family-iterated-rectangle
    authorId: block-4368c0e6-2c6
  - t: key
    label: Product-of-Functions Shortcut and Iterated Evaluation
    source: OpenStax Calculus Volume 3, Section 5.1
    sourceReview: sourced
    core: When an integrand factors into independent single-variable factors g(x)h(y) over a rectangle, the double integral factors into the product of two single-variable definite integrals.
    objectives:
      - obj-s4-1
    family: family-iterated-rectangle
    h: <p>Evaluating iterated integrals over rectangular boundaries follows distinct systematic rules:</p>
    items:
      - 'Inner integration: Integrate the inside expression with respect to its differential while treating the outer variable as a fixed constant.'
      - 'Product factorization shortcut: If <m>f(x, y) = g(x)h(y)</m> on <m>[a, b] \times [c, d]</m>, then <m>\iint_R g(x)h(y)\,dA = \left( \int_a^b g(x)\,dx \right) \left( \int_c^d h(y)\,dy \right)</m>.'
      - 'Strategic order selection: If integrating with respect to one variable first produces an elementary antiderivative while the other does not, swap the order of integration freely across rectangular limits.'
    ordered: true
    authorId: block-c4aea23f-da6
  - t: ex
    title: Volume under a Surface and Average Value
    objectives:
      - obj-s4-1
    family: family-volume-average-rect
    h: <p>Find the volume of the solid under <m>z = x y^2</m> over the rectangle <m>R = [0, 2] \times [0, 3]</m>, and determine the average value of <m>f(x, y)</m> over <m>R</m>.</p><p>Because <m>f(x, y) \ge 0</m> on <m>R</m>, the volume equals <m>V = \iint_R x y^2\,dA</m>. Since the integrand factors as <m>g(x)h(y)</m> with <m>g(x) = x</m> and <m>h(y) = y^2</m>, we factor the double integral:</p><p><m>V = \left( \int_0^2 x\,dx \right) \left( \int_0^3 y^2\,dy \right) = \left[ \frac{x^2}{2} \right]_0^2 \left[ \frac{y^3}{3} \right]_0^3 = (2)(9) = 18</m>.</p><p>The area of <m>R</m> is <m>\text{Area}(R) = (2 - 0)(3 - 0) = 6</m>. The average value of <m>f</m> on <m>R</m> is defined by <m>f_{\text{avg}} = \frac{1}{\text{Area}(R)} \iint_R f(x, y)\,dA = \frac{18}{6} = 3</m>.</p>
    authorId: block-6a316c29-fe3
  - t: trap
    label: Treating Inner Variables as Constants Outside Integration Scope
    source: OpenStax Calculus Volume 3, Section 5.1
    sourceReview: sourced
    core: Variables associated with the inner differential cannot be factored outside the inner integral sign.
    objectives:
      - obj-s4-1
    family: family-iterated-rectangle
    h: <p>A frequent error is pulling expressions involving the inner integration variable outside the inner integral. In <m>\int_a^b \int_c^d f(x, y)\,dy\,dx</m>, any factor containing <m>y</m> must remain inside the <m>dy</m> integral. Only terms that depend solely on the outer variable <m>x</m> can be treated as constants during the <m>dy</m> step and factored through the inner integral.</p>
    authorId: block-d91ef6a9-6d6
quiz:
  - type: Midpoint rule double sum
    concept: double-integral
    objectives:
      - obj-s4-1
    family: family-riemann-double
    q: Estimate the double integral <m>\iint_R (2x + y)\,dA</m> over the rectangle <m>R = [0, 4] \times [0, 2]</m> using a Riemann sum with <m>m = 2</m>, <m>n = 2</m> subrectangles and midpoints for sample evaluation.
    verified: true
    response:
      kind: number
      value: 40
    why: The grid intervals have widths <m>\Delta x = \frac{4-0}{2} = 2</m> and <m>\Delta y = \frac{2-0}{2} = 1</m>, giving subrectangle area <m>\Delta A = 2 \times 1 = 2</m>. The subinterval midpoints are <m>x \in \{1, 3\}</m> and <m>y \in \{0.5, 1.5\}</m>. Evaluating <m>f(x, y) = 2x + y</m> at the four midpoint pairs yields <m>f(1, 0.5) = 2.5</m>, <m>f(3, 0.5) = 6.5</m>, <m>f(1, 1.5) = 3.5</m>, and <m>f(3, 1.5) = 7.5</m>. Summing these gives <m>2.5 + 6.5 + 3.5 + 7.5 = 20</m>. Multiplying by <m>\Delta A = 2</m> yields <m>20 \times 2 = 40</m>.
    authorId: quiz-70a7013f-54a
  - type: Product shortcut iterated integral
    concept: fubini-theorem
    objectives:
      - obj-s4-1
    family: family-iterated-rectangle
    q: Evaluate the iterated integral <m>\int_0^{\pi/2} \int_0^1 x \cos(y)\,dx\,dy</m>.
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: <m>\frac{1}{2}</m>
          why: By Fubini's theorem and the product separation shortcut, the integral factors as <m>\left(\int_0^1 x\,dx\right)\left(\int_0^{\pi/2}\cos y\,dy\right) = \left[\frac{x^2}{2}\right]_0^1 \left[\sin y\right]_0^{\pi/2} = \left(\frac{1}{2}\right)(1) = \frac{1}{2}</m>.
        - text: <m>1</m>
          why: Forgetting the factor of 1/2 from the antiderivative of x gives 1 instead of 1/2.
        - text: <m>\frac{\pi}{4}</m>
          why: 'The antiderivative of <m>\cos y</m> evaluates to <m>\sin(\pi/2) - \sin(0) = 1</m>, not <m>\pi/2</m>.'
        - text: <m>0</m>
          why: Neither factor integrates to zero over the given limits.
    why: 'The double integral factors as the product of two independent single integrals, yielding <m>\left(\frac{1}{2}\right)(1) = \frac{1}{2}</m>.'
    authorId: quiz-503f0660-ce5
  - type: Average value on rectangle
    concept: double-integral
    objectives:
      - obj-s4-1
    family: family-volume-average-rect
    q: Find the average value of <m>f(x, y) = 6x^2 y</m> over the rectangular region <m>R = [0, 2] \times [0, 3]</m>.
    verified: true
    response:
      kind: number
      value: 12
    why: The area of the rectangle is <m>\text{Area}(R) = (2 - 0)(3 - 0) = 6</m>. The double integral evaluates via product separation to <m>6\left(\int_0^2 x^2\,dx\right)\left(\int_0^3 y\,dy\right) = 6\left[\frac{x^3}{3}\right]_0^2\left[\frac{y^2}{2}\right]_0^3 = 6\left(\frac{8}{3}\right)\left(\frac{9}{2}\right) = 6(12) = 72</m>. The average value is <m>\frac{72}{\text{Area}(R)} = \frac{72}{6} = 12</m>.
    authorId: quiz-2fe09835-07b
