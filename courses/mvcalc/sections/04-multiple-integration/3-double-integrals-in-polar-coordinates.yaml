title: Double Integrals in Polar Coordinates
blocks:
  - t: p
    h: <p>When evaluating double integrals over regions with circular boundaries—such as disks, concentric rings, or sectors—Cartesian coordinates lead to complicated algebraic radicals like <m>\sqrt{R^2 - x^2}</m>. Furthermore, expressions involving <m>x^2 + y^2</m> frequently emerge in physics and engineering, from rotational inertia to gravitational potentials. Switching to polar coordinates <m>(r, \theta)</m> simplifies both the boundary descriptions and the integrand, exploiting the rotational symmetry of the domain.</p>
    authorId: block-17a79349-bb0
  - t: def
    term: Double Integrals in Polar Coordinates
    source: OpenStax Calculus Volume 3, Section 5.3
    sourceReview: sourced
    core: In polar coordinates, the planar area element transforms to <m>dA = r\,dr\,d\theta</m> due to the radial expansion of sector arc length.
    introduces:
      - obj-s4-3
      - polar-double-integral
    objectives:
      - obj-s4-3
    family: family-polar-convert-integral
    h: '<p>A polar rectangle is defined by constant radial and angular limits: <m>R = \{(r, \theta) \mid a \le r \le b, \, \alpha \le \theta \le \beta\}</m>. Subdividing <m>[a, b]</m> into <m>m</m> radial bands of width <m>\Delta r</m> and <m>[\alpha, \beta]</m> into <m>n</m> angular wedges of width <m>\Delta\theta</m> partitions <m>R</m> into polar subrectangles. The area of a subrectangle between radii <m>r_{i-1}</m> and <m>r_i</m> is given by the difference of circular sector areas: <m>\Delta A_i = \frac{1}{2}r_i^2\Delta\theta - \frac{1}{2}r_{i-1}^2\Delta\theta = \frac{r_i + r_{i-1}}{2}\Delta r\,\Delta\theta = r_i^*\,\Delta r\,\Delta\theta</m>, where <m>r_i^*</m> is the average radius. Passing to the limit as <m>\Delta r, \Delta\theta \to 0</m> reveals the polar differential area element <m>dA = r\,dr\,d\theta</m>.</p>'
    authorId: block-d340a0fc-bff
  - t: math
    label: Polar Double Integral Conversion Formula
    tex: \iint_D f(x, y)\,dA = \int_\alpha^\beta \int_{h_1(\theta)}^{h_2(\theta)} f(r\cos\theta, r\sin\theta)\,r\,dr\,d\theta
    note: Remember to substitute <m>x = r\cos\theta</m>, <m>y = r\sin\theta</m>, and include the metric factor <m>r</m> in <m>dA = r\,dr\,d\theta</m>.
    objectives:
      - obj-s4-3
    family: family-polar-convert-integral
    authorId: block-9f8a6725-903
  - t: ex
    title: Evaluating a Gaussian Double Integral over a Disk
    objectives:
      - obj-s4-3
    family: family-polar-convert-integral
    h: <p>Evaluate <m>\iint_D e^{-(x^2 + y^2)}\,dA</m>, where <m>D</m> is the closed disk <m>x^2 + y^2 \le 4</m>.</p><p>In Cartesian coordinates, the antiderivative of <m>e^{-x^2}</m> has no elementary representation. In polar coordinates, <m>x^2 + y^2 = r^2</m>, and the disk is described by <m>0 \le r \le 2</m> with <m>0 \le \theta \le 2\pi</m>. Replacing <m>dA</m> with <m>r\,dr\,d\theta</m> introduces an indispensable factor of <m>r</m>:</p><p><m>\iint_D e^{-(x^2 + y^2)}\,dA = \int_0^{2\pi} \int_0^2 e^{-r^2} r\,dr\,d\theta = \left(\int_0^{2\pi} d\theta\right)\left(\int_0^2 e^{-r^2} r\,dr\right)</m></p><p>Using substitution <m>u = -r^2</m> with <m>du = -2r\,dr</m>, the radial integral evaluates to <m>\left[-\frac{1}{2}e^{-r^2}\right]_0^2 = \frac{1}{2}(1 - e^{-4})</m>. Multiplying by the angular factor <m>2\pi</m> gives <m>\pi(1 - e^{-4})</m>.</p>
    authorId: block-97faaa51-a00
  - t: key
    label: Polar Formulations for Area and Enclosed Volume
    source: OpenStax Calculus Volume 3, Section 5.3
    sourceReview: sourced
    core: Planar area in polar coordinates is given by <m>\iint_D r\,dr\,d\theta</m>, and the volume beneath a surface <m>z = f(r, \theta)</m> is <m>\iint_D f(r, \theta)\,r\,dr\,d\theta</m>.
    objectives:
      - obj-s4-3
    family: family-polar-region-area-volume
    h: <p>Polar integration provides direct formulas for geometric measurements:</p>
    items:
      - 'Planar area: For a region bounded by polar curves <m>0 \le r \le h(\theta)</m> from <m>\alpha</m> to <m>\beta</m>, <m>\text{Area}(D) = \int_\alpha^\beta \int_0^{h(\theta)} r\,dr\,d\theta = \frac{1}{2}\int_\alpha^\beta [h(\theta)]^2\,d\theta</m>.'
      - 'Solid volume: If <m>z = f(r, \theta) \ge 0</m> over domain <m>D</m>, the volume of the solid under the surface and above the <m>xy</m>-plane is <m>V = \iint_D f(r, \theta)\,r\,dr\,d\theta</m>.'
      - 'Coordinate transformation indicators: Convert to polar coordinates whenever domain boundaries are circles <m>x^2 + y^2 = a^2</m> or integrands contain <m>x^2 + y^2</m>.'
    ordered: true
    authorId: block-d63f1e5a-ee7
  - t: ex
    title: Volume under a Paraboloid over a Circular Domain
    objectives:
      - obj-s4-3
    family: family-polar-region-area-volume
    h: <p>Find the volume of the solid enclosed below the paraboloid <m>z = 9 - x^2 - y^2</m> and above the <m>xy</m>-plane (<m>z = 0</m>).</p><p>The boundary curve where the surface meets the <m>xy</m>-plane is <m>9 - x^2 - y^2 = 0 \implies x^2 + y^2 = 9</m>, which is a circle of radius <m>3</m> centered at the origin. In polar coordinates, the base region <m>D</m> is <m>0 \le r \le 3</m> and <m>0 \le \theta \le 2\pi</m>, and the height function becomes <m>z = 9 - r^2</m>.</p><p>Set up and evaluate the volume integral:</p><p><m>V = \int_0^{2\pi} \int_0^3 (9 - r^2)\,r\,dr\,d\theta = \left(\int_0^{2\pi} d\theta\right)\int_0^3 (9r - r^3)\,dr</m></p><p>Evaluating the single integrals gives <m>2\pi \left[\frac{9r^2}{2} - \frac{r^4}{4}\right]_0^3 = 2\pi\left(\frac{81}{2} - \frac{81}{4}\right) = 2\pi\left(\frac{81}{4}\right) = \frac{81\pi}{2}</m>.</p>
    authorId: block-98bbfece-b64
  - t: trap
    label: Forgetting the Extra Factor r in the Polar Area Element
    source: OpenStax Calculus Volume 3, Section 5.3
    sourceReview: sourced
    core: Omitting the metric scaling factor <m>r</m> when replacing <m>dx\,dy</m> with polar differentials distorts spatial area and invalidates the integral.
    objectives:
      - obj-s4-3
    family: family-polar-convert-integral
    h: '<p>A widespread mistake is substituting <m>dx\,dy = dr\,d\theta</m>. Because radial coordinate lines diverge as distance from the pole increases, a polar patch <m>\Delta r \times \Delta\theta</m> is not an area rectangle of sides <m>\Delta r</m> and <m>\Delta\theta</m>; its tangential arc length is <m>r\,\Delta\theta</m>. Always include the factor of <m>r</m> in the volume or area differential: <m>dA = r\,dr\,d\theta</m>.</p>'
    authorId: block-98721d4d-7f6
quiz:
  - type: Polar conversion and evaluation
    concept: polar-double-integral
    objectives:
      - obj-s4-3
    family: family-polar-convert-integral
    q: Convert and evaluate the integral <m>\int_0^2 \int_0^{\sqrt{4 - x^2}} \sqrt{x^2 + y^2}\,dy\,dx</m> using polar coordinates.
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: <m>\frac{4\pi}{3}</m>
          why: In polar coordinates, the first quadrant quarter-disk is described by <m>0 \le r \le 2</m> and <m>0 \le \theta \le \pi/2</m>. The integral becomes <m>\int_0^{\pi/2} \int_0^2 r \cdot r\,dr\,d\theta = \left[\theta\right]_0^{\pi/2} \left[\frac{r^3}{3}\right]_0^2 = \left(\frac{\pi}{2}\right)\left(\frac{8}{3}\right) = \frac{4\pi}{3}</m>.
        - text: <m>\frac{8\pi}{3}</m>
          why: Integrating over a full disk of angle <m>\pi</m> instead of a quarter-disk doubles the answer to <m>\frac{8\pi}{3}</m>.
        - text: <m>\frac{2\pi}{3}</m>
          why: Forgetting the metric factor <m>r</m> yields an incorrect power in the radial integrand.
        - text: <m>2\pi</m>
          why: Evaluating without integrating the radial coordinate properly produces <m>2\pi</m>.
    why: In polar coordinates the quarter disk integrates as <m>\int_0^{\pi/2} \int_0^2 r^2\,dr\,d\theta = \left(\frac{\pi}{2}\right)\left(\frac{8}{3}\right) = \frac{4\pi}{3}</m>.
    authorId: quiz-f72881f5-b62
  - type: Polar area of rose petal
    concept: polar-double-integral
    objectives:
      - obj-s4-3
    family: family-polar-region-area-volume
    q: What is the area of the region enclosed by one petal of the four-petaled rose <m>r = 2\cos(2\theta)</m>?
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: <m>\frac{\pi}{2}</m>
          why: One loop is bounded by <m>-\pi/4 \le \theta \le \pi/4</m>. The area is <m>\int_{-\pi/4}^{\pi/4} \int_0^{2\cos(2\theta)} r\,dr\,d\theta = \frac{1}{2}\int_{-\pi/4}^{\pi/4} 4\cos^2(2\theta)\,d\theta = \int_{-\pi/4}^{\pi/4}(1 + \cos 4\theta)\,d\theta = \frac{\pi}{2}</m>.
        - text: <m>\pi</m>
          why: Computing over an angular interval of length <m>\pi</m> covers two full petals instead of one.
        - text: <m>2\pi</m>
          why: <m>2\pi</m> is the total area of all four petals combined.
        - text: <m>\frac{\pi}{4}</m>
          why: Forgetting the factor of <m>2^2 = 4</m> from the amplitude reduces the area by half.
    why: Integrating <m>\frac{1}{2} r^2</m> over <m>[-\pi/4, \pi/4]</m> yields <m>\frac{\pi}{2}</m>.
    authorId: quiz-8af4ff38-6f0
  - type: Polar volume under hemisphere
    concept: polar-double-integral
    objectives:
      - obj-s4-3
    family: family-polar-region-area-volume
    q: What is the volume of the solid bounded above by the hemisphere <m>z = \sqrt{16 - x^2 - y^2}</m> and below by the <m>xy</m>-plane (<m>z = 0</m>)?
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: <m>\frac{128\pi}{3}</m>
          why: In polar coordinates, the domain is the disk <m>0 \le r \le 4</m>, <m>0 \le \theta \le 2\pi</m>. The volume is <m>\int_0^{2\pi} \int_0^4 \sqrt{16 - r^2}\,r\,dr\,d\theta = 2\pi \left[-\frac{1}{3}(16 - r^2)^{3/2}\right]_0^4 = 2\pi\left(\frac{64}{3}\right) = \frac{128\pi}{3}</m>.
        - text: <m>\frac{64\pi}{3}</m>
          why: Forgetting the factor of 2 from the angular integral yields <m>\frac{64\pi}{3}</m>.
        - text: <m>64\pi</m>
          why: Integrating the cylinder of radius 4 and height 4 rather than the hemisphere gives an incorrect volume.
        - text: <m>\frac{256\pi}{3}</m>
          why: <m>\frac{256\pi}{3}</m> is the volume of the entire sphere of radius 4, not the hemisphere.
    why: Evaluating the polar double integral gives <m>2\pi(64/3) = \frac{128\pi}{3}</m>.
    authorId: quiz-1f94a5e6-35c
