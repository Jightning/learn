title: Maxima and Minima
blocks:
  - t: p
    h: '<p>Finding optimal conditions—maximizing industrial yield, minimizing energy consumption, and computing minimal geometric distances—is a central purpose of calculus. In single-variable calculus, candidate extrema occur at critical points where <m>f''(x) = 0</m> and are classified using second derivatives. For a two-variable surface <m>z = f(x, y)</m>, a horizontal tangent plane requires both directional slopes to vanish simultaneously: <m>f_x = 0</m> and <m>f_y = 0</m>, or <m>\nabla f = \mathbf{0}</m>.</p>'
    authorId: block-ed1c577c-4f1
  - t: def
    term: Critical Points and Local Extrema
    source: OpenStax Calculus Volume 3, Section 4.7
    sourceReview: sourced
    core: A point <m>(a, b)</m> is a critical point of <m>f(x, y)</m> if <m>f_x(a, b) = 0</m> and <m>f_y(a, b) = 0</m>, or if either partial derivative fails to exist.
    introduces:
      - obj-s3-7
      - critical-point
    objectives:
      - obj-s3-7
    family: family-critical-classify
    h: '<p>A function <m>f(x, y)</m> has a local maximum at <m>(a, b)</m> if <m>f(x, y) \le f(a, b)</m> for all points in an open disk centered at <m>(a, b)</m>; it has a local minimum if <m>f(x, y) \ge f(a, b)</m>. By Fermat’s theorem for several variables, if <m>f</m> has a local extremum at <m>(a, b)</m> and is differentiable there, the tangent plane must be horizontal: <m>\nabla f(a, b) = \langle 0, 0 \rangle</m>. Any point in the domain where <m>\nabla f = \mathbf{0}</m> (or where at least one partial derivative fails to exist) is called a critical point.</p>'
    authorId: block-962e88d8-3fa
  - t: def
    term: Second Derivative Test and Discriminant D
    source: OpenStax Calculus Volume 3, Section 4.7
    sourceReview: sourced
    core: For a critical point with continuous second partials, let <m>D = f_{xx}f_{yy} - (f_{xy})^2</m>; if <m>D > 0</m> and <m>f_{xx} > 0</m> it is a local min; if <m>D > 0</m> and <m>f_{xx} < 0</m> local max; if <m>D < 0</m> saddle point; if <m>D = 0</m> inconclusive.
    introduces:
      - second-derivative-test
    objectives:
      - obj-s3-7
    family: family-critical-classify
    h: <p>To classify a critical point <m>(a, b)</m> where <m>f_x(a, b) = f_y(a, b) = 0</m> and the second partial derivatives are continuous, compute the discriminant <m>D = f_{xx}(a, b)f_{yy}(a, b) - [f_{xy}(a, b)]^2</m>. If <m>D > 0</m> and <m>f_{xx}(a, b) > 0</m>, then <m>f(a, b)</m> is a local minimum. If <m>D > 0</m> and <m>f_{xx}(a, b) < 0</m>, then <m>f(a, b)</m> is a local maximum. If <m>D < 0</m>, then <m>(a, b)</m> is a saddle point where the surface curves upward in one cross-section and downward in another. If <m>D = 0</m>, the second derivative test is inconclusive.</p>
    authorId: block-e98927be-d8f
  - t: math
    label: Second Derivative Discriminant Formula
    tex: D = \det \begin{pmatrix} f_{xx} & f_{xy} \\ f_{xy} & f_{yy} \end{pmatrix} = f_{xx}f_{yy} - (f_{xy})^2
    note: D is the determinant of the 2x2 Hessian matrix of second-order partial derivatives.
    objectives:
      - obj-s3-7
    family: family-critical-classify
    authorId: block-724e5cff-006
  - t: ex
    title: Classifying Critical Points of a Cubic Function
    objectives:
      - obj-s3-7
    family: family-critical-classify
    h: '<p>Find and classify all critical points of <m>f(x, y) = x^3 + y^3 - 3x y</m>.</p><p>First compute first partial derivatives and set them to zero: <m>f_x = 3x^2 - 3y = 0 \implies y = x^2</m>, and <m>f_y = 3y^2 - 3x = 0 \implies x = y^2</m>.</p><p>Substitute <m>y = x^2</m> into <m>x = y^2</m>: <m>x = (x^2)^2 = x^4 \implies x(x^3 - 1) = 0</m>. Real solutions are <m>x = 0</m> (giving <m>y = 0</m>) and <m>x = 1</m> (giving <m>y = 1</m>). The critical points are <m>(0, 0)</m> and <m>(1, 1)</m>.</p><p>Compute second partials: <m>f_{xx} = 6x</m>, <m>f_{yy} = 6y</m>, and <m>f_{xy} = -3</m>. The discriminant is <m>D = (6x)(6y) - (-3)^2 = 36x y - 9</m>.</p><p>At <m>(0, 0)</m>: <m>D = -9 < 0</m>, so <m>(0, 0)</m> is a saddle point.</p><p>At <m>(1, 1)</m>: <m>D = 36(1) - 9 = 27 > 0</m> and <m>f_{xx}(1, 1) = 6 > 0</m>, so <m>(1, 1)</m> is a local minimum with value <m>f(1, 1) = 1 + 1 - 3 = -1</m>.</p>'
    authorId: block-de781dd7-547
  - t: def
    term: Absolute Extrema and the Extreme Value Theorem
    source: OpenStax Calculus Volume 3, Section 4.7
    sourceReview: sourced
    core: A continuous function <m>f(x, y)</m> on a closed, bounded region <m>R \subset \mathbb{R}^2</m> achieves both an absolute maximum and an absolute minimum on <m>R</m>.
    introduces:
      - absolute-extrema
    objectives:
      - obj-s3-7
    family: family-absolute-extrema-region
    h: '<p>The Extreme Value Theorem ensures that any continuous multivariable function on a closed and bounded domain <m>R</m> achieves global maximum and minimum values. To find them, follow three steps:</p>'
    items:
      - 'Locate all critical points in the interior of <m>R</m> and evaluate <m>f</m> at each.'
      - 'Find all candidate extreme points on the boundary of <m>R</m> and evaluate <m>f</m> at those points and at all corners.'
      - 'Compare all evaluated values: the greatest is the absolute maximum, and the least is the absolute minimum.'
    ordered: true
    authorId: block-813169fe-15f
  - t: ex
    title: Maximizing the Volume of an Open-Top Box
    objectives:
      - obj-s3-7
    family: family-optimization-applied
    h: '<p>An open-top rectangular box is made from <m>12\text{ m}^2</m> of material. Find the maximum possible volume.</p><p>Let the box have dimensions <m>x</m>, <m>y</m>, and height <m>z</m>. The surface area constraint is <m>S = x y + 2x z + 2y z = 12</m>. Solving for <m>z</m> gives <m>z = \frac{12 - x y}{2(x + y)}</m>.</p><p>Substitute into volume <m>V = x y z</m>: by symmetry of the base, maximum volume occurs when <m>x = y</m>. Then <m>x^2 + 4x z = 12 \implies z = \frac{12 - x^2}{4x}</m>. The volume becomes <m>V(x) = x^2\left(\frac{12 - x^2}{4x}\right) = 3x - \frac{1}{4}x^3</m>.</p><p>Differentiating with respect to <m>x</m>: <m>\frac{dV}{dx} = 3 - \frac{3}{4}x^2 = 0 \implies x^2 = 4 \implies x = 2\text{ m}</m>. Then <m>y = 2\text{ m}</m> and <m>z = \frac{12 - 4}{4(2)} = 1\text{ m}</m>. The maximum volume is <m>V = (2)(2)(1) = 4\text{ m}^3</m>.</p>'
    authorId: block-456ba9aa-42c
  - t: trap
    label: Overlooking Boundary Analysis for Absolute Extrema
    source: OpenStax Calculus Volume 3, Section 4.7
    sourceReview: sourced
    core: Absolute extrema on a closed bounded region frequently occur along the boundary rather than at interior critical points.
    objectives:
      - obj-s3-7
    family: family-absolute-extrema-region
    h: <p>A classic error is testing only interior critical points where <m>\nabla f = \mathbf{0}</m> and concluding no extrema exist if there are no interior points. On a closed bounded region, global extrema regularly lie on the boundary edges or corners. For example, a linear function <m>f(x, y) = 3x - 2y</m> has non-zero constant gradient <m>\langle 3, -2 \rangle</m> and thus zero interior critical points; yet on any closed rectangle or disk, it attains both an absolute maximum and minimum entirely along the boundary.</p>
    authorId: block-847cd6d7-adf
quiz:
  - type: Critical point classification
    concept: second-derivative-test
    objectives:
      - obj-s3-7
    family: family-critical-classify
    q: For the function <m>f(x, y) = x^2 - 4x y + y^3 + 4y</m>, what is the classification of the critical point <m>(4, 2)</m>?
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: Local minimum
          why: The second partial derivatives are <m>f_{xx} = 2</m>, <m>f_{yy} = 6y = 12</m>, and <m>f_{xy} = -4</m>. The discriminant is <m>D = (2)(12) - (-4)^2 = 24 - 16 = 8 > 0</m>. Because <m>D > 0</m> and <m>f_{xx} = 2 > 0</m>, <m>(4, 2)</m> is a local minimum.
        - text: Local maximum
          why: A local maximum requires <m>f_{xx} < 0</m>, but here <m>f_{xx} = 2 > 0</m>.
        - text: Saddle point
          why: A saddle point requires <m>D < 0</m>, but here <m>D = 8 > 0</m>.
        - text: Inconclusive because <m>D = 0</m>
          why: The discriminant <m>D = 8</m> is strictly positive, so the test is definitive.
    why: At <m>(4, 2)</m>, the discriminant is <m>D = 8 > 0</m> and <m>f_{xx} = 2 > 0</m>, classifying it as a local minimum.
    authorId: quiz-b101fc21-0a6
  - type: Absolute maximum on a closed rectangle
    concept: absolute-extrema
    objectives:
      - obj-s3-7
    family: family-absolute-extrema-region
    q: What is the absolute maximum value of <m>f(x, y) = 4x + 6y - x^2 - y^2</m> on the closed rectangular region <m>[0, 4] \times [0, 4]</m>?
    verified: true
    response:
      kind: number
      value: 13
    why: Completing the square gives <m>f(x, y) = 13 - (x - 2)^2 - (y - 3)^2</m>. The unique critical point is <m>(2, 3)</m>, which lies inside the region <m>[0, 4] \times [0, 4]</m>. Because the squared terms are non-negative, the maximum possible value is <m>13</m>, achieved at <m>(2, 3)</m>.
    authorId: quiz-0a7e76fe-661
  - type: Applied optimization for box volume
    concept: critical-point
    objectives:
      - obj-s3-7
    family: family-optimization-applied
    q: An open-top rectangular box is to be constructed with a fixed surface area of <m>12\text{ m}^2</m>. What is the maximum volume (in <m>\text{m}^3</m>) of the box?
    verified: true
    response:
      kind: number
      value: 4
    why: With base dimensions <m>x = 2</m>, <m>y = 2</m> and height <m>z = 1</m>, the surface area is <m>x y + 2x z + 2y z = 4 + 4 + 4 = 12\text{ m}^2</m>. The maximum volume is <m>V = (2)(2)(1) = 4\text{ m}^3</m>.
    authorId: quiz-15377114-6ea
