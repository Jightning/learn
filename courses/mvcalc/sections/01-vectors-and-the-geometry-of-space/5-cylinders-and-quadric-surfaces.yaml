title: Cylinders and Quadric Surfaces
blocks:
  - t: p
    h: <p>Moving from planes to curved surfaces in three dimensions, the simplest two-dimensional surfaces are cylinders—formed by translating a planar curve along parallel lines—and quadric surfaces, which are the 3D counterparts of conic sections. By examining traces (the curves created by intersecting a surface with planes parallel to the coordinate planes), we can systematically recognize and classify any second-degree surface.</p>
    authorId: block-02b5a5c9-264
  - t: def
    term: Cylinders and Coordinate Traces
    source: OpenStax Calculus Volume 3, Section 2.6
    sourceReview: sourced
    core: A cylinder consists of parallel rulings passing through a generating plane curve; an equation missing one variable in 3D defines a cylinder parallel to that axis.
    introduces:
      - obj-s1-5
      - cylinder-surface
    objectives:
      - obj-s1-5
    family: family-cylinder-traces
    h: <p>A cylinder is a surface generated by a straight line (the ruling) moving parallel to a fixed line along a given plane curve (the generating curve):</p>
    items:
      - 'Missing variable rule: In <m>\mathbb{R}^3</m>, any equation containing only two coordinate variables defines a cylinder whose rulings are parallel to the axis of the missing variable.'
      - 'Circular and elliptic cylinders: <m>x^2 + y^2 = r^2</m> has rulings parallel to the <m>z</m>-axis; <m>y^2/b^2 + z^2/c^2 = 1</m> has rulings parallel to the <m>x</m>-axis.'
      - 'Parabolic cylinder: <m>z = y^2</m> has a parabolic profile in the <m>yz</m>-plane, extending indefinitely parallel to the <m>x</m>-axis.'
      - 'Traces: A trace of a surface is the cross-sectional curve obtained by intersecting the surface with a plane <m>x = k</m>, <m>y = k</m>, or <m>z = k</m>.'
    ordered: true
    authorId: block-4a93c6f9-edf
  - t: def
    term: Quadric Surfaces
    source: OpenStax Calculus Volume 3, Section 2.6
    sourceReview: sourced
    core: A quadric surface is the graph of a second-degree polynomial equation in three variables, categorized into six standard shapes by traces and signs.
    introduces:
      - quadric-surface
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    h: '<p>A quadric surface is the three-dimensional graph of a general second-degree equation <m>Ax^2 + By^2 + Cz^2 + Dxy + Eyz + Fxz + Gx + Hy + Iz + J = 0</m>. By suitable translation (completing the square) and rotation of coordinate axes, every non-degenerate quadric surface can be brought into one of two standard forms: <m>Ax^2 + By^2 + Cz^2 + J = 0</m> or <m>Ax^2 + By^2 + Iz = 0</m>.</p>'
    authorId: block-bf724008-c93
  - t: math
    label: Standard Equation of an Ellipsoid
    tex: \frac{x^2}{a^2} + \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1
    note: Every cross-sectional trace parallel to a coordinate plane is an ellipse, shrinking to a point at the boundary vertices.
    authorId: block-7578dda9-405
  - t: table
    id: quadrics-table
    cap: Summary of the Six Standard Quadric Surfaces
    head:
      - Surface
      - Standard Equation
      - Horizontal Traces (z = k)
      - Vertical Traces
    rows:
      - - Ellipsoid
        - <m>\frac{x^2}{a^2} + \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1</m>
        - Ellipses for <m>|k| < c</m>
        - Ellipses in <m>x = k</m> and <m>y = k</m>
      - - Elliptic Paraboloid
        - <m>\frac{z}{c} = \frac{x^2}{a^2} + \frac{y^2}{b^2}</m>
        - Ellipses (<m>k > 0</m> if <m>c > 0</m>)
        - Parabolas in <m>x = k</m> and <m>y = k</m>
      - - Hyperbolic Paraboloid
        - <m>\frac{z}{c} = \frac{x^2}{a^2} - \frac{y^2}{b^2}</m>
        - Hyperbolas (lines when <m>k = 0</m>)
        - Parabolas (saddle surface)
      - - Elliptic Cone
        - <m>\frac{z^2}{c^2} = \frac{x^2}{a^2} + \frac{y^2}{b^2}</m>
        - Ellipses (<m>k \neq 0</m>); point (<m>k = 0</m>)
        - Hyperbolas (<m>k \neq 0</m>); lines (<m>k = 0</m>)
      - - Hyperboloid of One Sheet
        - <m>\frac{x^2}{a^2} + \frac{y^2}{b^2} - \frac{z^2}{c^2} = 1</m>
        - Ellipses for all <m>k</m>
        - Hyperbolas (connected waist)
      - - Hyperboloid of Two Sheets
        - <m>-\frac{x^2}{a^2} - \frac{y^2}{b^2} + \frac{z^2}{c^2} = 1</m>
        - Ellipses for <m>|k| > c</m>; empty for <m>|k| < c</m>
        - Hyperbolas (two separate pieces)
    authorId: block-a2fa06c3-6d5
  - t: key
    label: Identifying Surfaces by Axis and Term Signs
    source: OpenStax Calculus Volume 3, Section 2.6
    sourceReview: sourced
    core: The linear variable identifies the axis of a paraboloid, while the unique-signed term identifies the axis of a cone or hyperboloid.
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    h: <p>To determine the type and orientation of a quadric surface without graphing software:</p>
    items:
      - 'Linear variable indicates paraboloid axis: In <m>\frac{y}{b} = \frac{x^2}{a^2} + \frac{z^2}{c^2}</m>, <m>y</m> is linear, so the paraboloid opens along the <m>y</m>-axis.'
      - 'Hyperboloid of one sheet: In standard form equal to <m>+1</m>, exactly one term is negative. The axis of symmetry corresponds to the negative term.'
      - 'Hyperboloid of two sheets: In standard form equal to <m>+1</m>, exactly two terms are negative. The axis of symmetry corresponds to the unique positive term.'
      - 'Elliptic cone: When equal to 0 with two positive and one negative quadratic term, the surface is a cone opening along the axis of the negative term.'
    ordered: true
    authorId: block-9d566230-812
  - t: ex
    title: Completing the Square to Classify a Shifted Quadric
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    h: '<p>Identify the surface <m>4x^2 - y^2 + 2z^2 + 4y - 8 = 0</m>. Regroup by variable: <m>4x^2 - (y^2 - 4y) + 2z^2 = 8</m>. Complete the square for <m>y</m>: <m>4x^2 - (y^2 - 4y + 4) + 2z^2 = 8 - 4 = 4</m>. This gives <m>4x^2 - (y - 2)^2 + 2z^2 = 4</m>. Dividing by 4 yields <m>x^2 - \frac{(y - 2)^2}{4} + \frac{z^2}{2} = 1</m>. With two positive quadratic terms and one negative quadratic term equal to <m>+1</m>, this is a hyperboloid of one sheet centered at <m>(0, 2, 0)</m> with axis of symmetry parallel to the <m>y</m>-axis.</p>'
    authorId: block-2d51d221-850
  - t: trap
    label: Distinguishing One Sheet from Two Sheets
    source: OpenStax Calculus Volume 3, Section 2.6
    sourceReview: sourced
    core: Always set the right-hand constant to <m>+1</m> before counting negative signs to distinguish one sheet from two sheets.
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    h: <p>A frequent error is counting negative signs before the constant term is normalized to <m>+1</m>. For instance, <m>x^2 + y^2 - z^2 = -1</m> appears to have one minus sign, but multiplying by <m>-1</m> gives <m>-x^2 - y^2 + z^2 = 1</m>, revealing that it is actually a hyperboloid of two sheets with a gap where <m>|z| < 1</m>.</p>
    authorId: block-53c6c594-291
quiz:
  - type: Cylinder recognition
    concept: cylinder-surface
    objectives:
      - obj-s1-5
    family: family-cylinder-traces
    q: Which description correctly identifies the surface in <m>\mathbb{R}^3</m> given by the equation <m>y = z^2</m>?
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: A parabolic cylinder whose rulings are parallel to the <m>x</m>-axis
          why: Because the variable <m>x</m> is missing, the parabola <m>y = z^2</m> in the <m>yz</m>-plane extends indefinitely parallel to the <m>x</m>-axis.
        - text: A parabola confined strictly to the coordinate plane <m>x = 0</m>
          why: In three dimensions, missing <m>x</m> means <m>x</m> is free to take any value, creating a 2D surface rather than a single curve.
        - text: An elliptic paraboloid opening along the <m>y</m>-axis
          why: An elliptic paraboloid requires terms in all three variables, such as <m>y = x^2 + z^2</m>.
        - text: A hyperbolic cylinder whose rulings are parallel to the <m>z</m>-axis
          why: The profile curve <m>y = z^2</m> is a parabola, and the missing variable is <m>x</m>.
    authorId: quiz-8bac97dc-cf4
  - type: Quadric surface identification
    concept: quadric-surface
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    q: What type of quadric surface is described by <m>x^2 - 4y^2 - z^2 = 4</m>, and along which axis does it open?
    verified: true
    response:
      kind: single
      correct: 2
      choices:
        - text: Hyperboloid of one sheet opening along the <m>y</m>-axis
          why: A hyperboloid of one sheet has only one negative term when the constant is <m>+1</m>.
        - text: Hyperboloid of two sheets opening along the <m>x</m>-axis
          why: Dividing by 4 gives <m>\frac{x^2}{4} - y^2 - \frac{z^2}{4} = 1</m>. With two minus signs and positive variable <m>x</m>, this is a hyperboloid of two sheets opening along the <m>x</m>-axis.
        - text: Elliptic cone opening along the <m>x</m>-axis
          why: An elliptic cone has a constant term of 0, not 4.
        - text: Hyperbolic paraboloid with saddle at the origin
          why: A hyperbolic paraboloid contains one linear variable, whereas all three are quadratic here.
    authorId: quiz-658d90bf-278
  - type: Shifted quadric identification
    concept: quadric-surface
    objectives:
      - obj-s1-5
    family: family-quadric-identify
    q: After completing the square, what surface does <m>z = 2x^2 + 3y^2 - 12y + 12</m> describe?
    verified: true
    response:
      kind: single
      correct: 1
      choices:
        - text: Elliptic paraboloid opening along the positive <m>z</m>-axis with vertex at <m>(0, 2, 0)</m>
          why: Factoring yields <m>z = 2x^2 + 3(y - 2)^2</m>. Since <m>z</m> is linear and both quadratic terms are positive, this is an elliptic paraboloid opening upwards along the <m>z</m>-axis.
        - text: Hyperbolic paraboloid with saddle point at <m>(0, 2, 0)</m>
          why: Both quadratic terms have positive signs, so cross sections are ellipses, not hyperbolas.
        - text: Ellipsoid centered at <m>(0, 2, 0)</m>
          why: An ellipsoid has three quadratic terms, but <m>z</m> is linear here.
        - text: Elliptic cone with vertex at <m>(0, 2, 0)</m>
          why: An elliptic cone has <m>z^2</m>, not linear <m>z</m>.
    authorId: quiz-bffa62b5-e1a
