      force.
    requires:
    - vector
    - space-coordinates
    introduces:
    - obj-s1-2
    - dot-product
    - vector-projection
    reasoning: u·v = |u||v|cos θ links algebra to geometry; sign of u·v tells acute/right/obtuse. Projection of v onto u uses
      (u·v)/|u| as a signed length. Work is the component of force along displacement times distance.
    practice: Angle between two 3D vectors; decide orthogonal/parallel/neither; compute proj and orthogonal remainder; work
      along a displacement.
  directives: 'Subsection title: "The Dot Product" in section "Vectors and the Geometry of Space". Source span — Section 2.3:
