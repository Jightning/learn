    reasoning: 'Cylindrical = polar in the xy-plane plus z. Spherical uses ρ distance from origin and φ measured down from
      the positive z-axis: x=ρ sinφ cosθ, y=ρ sinφ sinθ, z=ρ cosφ. Choose the system matching the symmetry.'
    practice: Convert a point both ways; rewrite a surface in the other systems and name it.
    boundary: This lesson sets the conventions (φ from +z axis, θ quadrant) reused by s4-5.
