  - question:self
  teaching:
    outcome: Use Stokes' theorem in either direction with consistent orientations and interpret curl through it.
    requires:
    - curl
    - flux-integral
    - vector-line-integral
    introduces:
    - obj-s5-7
    - stokes-theorem
    reasoning: Total circulation around the boundary equals total curl flux through any oriented surface with that boundary;
      right-hand rule links the curve direction to the normal. Green's circulation form is the flat case.
    practice: Circulation around the intersection of a plane and a cylinder; curl flux through a hemisphere replaced by a
      disk.
  directives: 'Subsection title: "Stokes'' Theorem" in section "Vector Calculus". Source span — Section 6.7: PDF pages 713–722
    (exposition), exercises from PDF page 723. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed family with at
    least one worked example, then 2–4 quiz questions that together cover every family (one question may cover two related
    families).'
