  - source: source-13a04ce1db9d0e5c
    unit: unit-a2a318ef593d21ed
  needs:
  - block:p
  - block:def
  - block:key
  - block:ex
  - block:trap
  - block:math
  - question:single
  - question:number
  - question:formula
  - question:self
  - block:table
  teaching:
    outcome: Use the divergence theorem to compute flux across closed surfaces and relate all the fundamental theorems of
      vector calculus.
    requires:
    - divergence
    - flux-integral
    - spherical-triple-integral
    introduces:
    - obj-s5-8
    - divergence-theorem
    reasoning: Outward flux through a closed surface equals total divergence inside; for inverse-square fields div is 0 away
      from the origin, so flux depends only on whether the origin is enclosed. All the theorems equate a boundary integral
      with an integral of a derivative over the interior.
    practice: Flux through the surface of a cube and a sphere; flux of an inverse-square field around the origin; select the
      appropriate theorem.
    representation:
      job: Compare the fundamental theorems (derivative, region, boundary) side by side
      needs:
      - block:table
  directives: 'Subsection title: "The Divergence Theorem" in section "Vector Calculus". Source span — Section 6.8: PDF pages
    729–739 (exposition), exercises from PDF page 740. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed
    family with at least one worked example, then 2–4 quiz questions that together cover every family (one question may cover
    two related families).'
