    - line-in-space
    - plane-equation
    reasoning: A line needs a point and direction; a plane needs a point and a normal n, giving n·(r−r0)=0. Normal vectors
      come from cross products; distances come from projections onto a normal or cross-product magnitudes.
    practice: Plane through three points; intersection line of two planes; classify two lines; point-to-plane distance.
  directives: 'Subsection title: "Equations of Lines and Planes in Space" in section "Vectors and the Geometry of Space".
