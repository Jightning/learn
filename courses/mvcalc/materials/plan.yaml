course: mvcalc
scope:
  format: course
  goal: A generic, self-contained multivariable calculus (Calculus III) course that thoroughly covers every standard topic
    — vectors and space geometry, vector-valued functions, partial differentiation and optimization, multiple integration,
    and vector calculus through the divergence theorem — with lean teaching and a small number of checked questions per lesson.
    Follows OpenStax Calculus Volume 3, chapters 2–6.
reader:
  goal: Learn multivariable calculus well enough to solve standard Calculus III problems in every topic, as in a typical university
    course.
  background:
  - id: bg-single-variable-calculus
    text: 'Single-variable calculus (Calculus I–II): limits, derivatives, integrals, the fundamental theorem of calculus,
      substitution, integration by parts, trigonometric integrals and basic improper integrals.'
  - id: bg-parametric-polar
    text: 'Parametric curves in the plane and polar coordinates: plotting, converting between polar and rectangular, polar
      curves and the polar area formula.'
  - id: bg-algebra-trig
    text: 'Algebra and trigonometry: completing the square, solving systems, trig identities and the unit circle.'
  failures: execution — sign, bound and algebra slips in long computations; transfer — choosing the right coordinate system,
    order of integration or theorem; detail retention — conventions such as unit direction vectors, orientation and the extra
    Jacobian factor.
  onboarding: 'Concrete anchor first: open on a small computed instance or picture, then state the general rule and its conditions.'
  priorities: Complete coverage of every topic first; durable understanding of why formulas hold; then speed.
  session_length: 30–60 minutes per subsection including its quiz.
  audience: A generic university student taking Calculus III; not tailored to any specific institution or exam.
