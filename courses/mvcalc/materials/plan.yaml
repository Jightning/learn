  - question:self
  teaching:
    outcome: Parametrize surfaces, compute surface area, and evaluate scalar surface integrals and flux integrals with the
      correct orientation.
    requires:
    - scalar-line-integral
    - cross-product
    - spherical-coordinates
    - change-of-variables
    introduces:
    - obj-s5-6
    - parametric-surface
    - scalar-surface-integral
    - flux-integral
    reasoning: '|r_u × r_v| du dv is the area of a small surface patch (extending the line-integral ds); flux accumulates
      the normal component F·n dS with n chosen by orientation, so the orientation must be checked against r_u × r_v.'
    practice: Parametrize a cone; area of a paraboloid piece; mass of a hemispherical shell; outward flux through a sphere.
  directives: 'Subsection title: "Surface Integrals" in section "Vector Calculus". Source span — Section 6.6: PDF pages 682–706
    (exposition), exercises from PDF page 707. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed family with at
    least one worked example, then 2–4 quiz questions that together cover every family (one question may cover two related
    families).'
