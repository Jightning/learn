    least one worked example, then 2–4 quiz questions that together cover every family (one question may cover two related
    families).'
- id: s5-3
  objectives:
  - obj-s5-3
  families:
  - family-test-conservative
  - family-find-potential
  - family-ftli-evaluate
  sources:
  - source: source-13a04ce1db9d0e5c
    unit: unit-3fab8e811c704537
  - source: source-13a04ce1db9d0e5c
    unit: unit-0458dd97f74bccaa
  needs:
  - block:p
  - block:def
  - block:key
  - block:ex
  - block:trap
  - block:math
  - question:single
  - question:number
  - question:formula
  - question:self
  teaching:
    outcome: Test fields for conservativeness, find potential functions and evaluate line integrals with the fundamental theorem.
    requires:
    - vector-line-integral
    - gradient-field
    - higher-order-partials
    introduces:
    - obj-s5-3
    - conservative-field
    - fundamental-theorem-line-integrals
    reasoning: 'Conservative ⇔ path independent ⇔ zero around every closed curve (on an open connected region). Equal mixed
      partials (Clairaut) make P_y = Q_x necessary; it is sufficient on simply connected domains (counterexample: the field
      −y/(x²+y²), x/(x²+y²) around the origin).'
    practice: Test and find a potential for a 2D and a 3D field; evaluate a line integral via endpoints; explain why a field
      with P_y=Q_x can still circulate around a hole.
  directives: 'Subsection title: "Conservative Vector Fields" in section "Vector Calculus". Source span — Section 6.3: PDF
    pages 624–639 (exposition), exercises from PDF page 640. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed
    family with at least one worked example, then 2–4 quiz questions that together cover every family (one question may cover
    two related families).'
- id: s5-4
  objectives:
  - obj-s5-4
  families:
  - family-greens-circulation
  - family-greens-flux
  - family-greens-area
  sources:
  - source: source-13a04ce1db9d0e5c
    unit: unit-678dfffd2b66e09a
  - source: source-13a04ce1db9d0e5c
    unit: unit-426929f7f12e07cc
  needs:
  - block:p
  - block:def
  - block:key
  - block:ex
  - block:trap
  - block:math
  - question:single
  - question:number
  - question:formula
  - question:self
  teaching:
    outcome: Apply both forms of Green's theorem to convert between line integrals around closed curves and double integrals,
      including area computations and regions with holes.
    requires:
    - conservative-field
    - general-region
    - polar-double-integral
    introduces:
    - obj-s5-4
    - greens-theorem
    reasoning: Green's theorem relates total microscopic circulation (Q_x−P_y) or source strength (P_x+Q_y) inside a region
      to the boundary integral; positive orientation keeps the region on the left. It extends to regions with holes by orienting
      inner boundaries clockwise.
    practice: Line integral around a triangle via a double integral; outward flux across a circle; area of an ellipse via
      a line integral.
  directives: 'Subsection title: "Green''s Theorem" in section "Vector Calculus". Source span — Section 6.4: PDF pages 643–660
    (exposition), exercises from PDF page 661. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed family with at
    least one worked example, then 2–4 quiz questions that together cover every family (one question may cover two related
    families).'
- id: s5-5
  objectives:
  - obj-s5-5
  families:
