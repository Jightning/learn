  - source: source-13a04ce1db9d0e5c
    unit: unit-4831efd6fd3fcc39
  needs:
  - block:p
  - block:def
  - block:key
  - block:ex
  - block:trap
  - block:math
  - question:single
  - question:number
  - question:formula
  - question:self
  teaching:
    outcome: Compute and interpret divergence and curl, and use their identities to test fields.
    requires:
    - greens-theorem
    - cross-product
    introduces:
    - obj-s5-5
    - divergence
    - curl
    reasoning: Divergence measures expansion/source density; curl measures infinitesimal rotation, with the 2D Green integrands
      as special cases. Mixed-partial equality gives curl∇f = 0 and div curl F = 0.
    practice: Compute div and curl; decide whether a field is conservative in 3D; show a field cannot be the curl of another.
  directives: 'Subsection title: "Divergence and Curl" in section "Vector Calculus". Source span — Section 6.5: PDF pages
    667–678 (exposition), exercises from PDF page 679. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed
    family with at least one worked example, then 2–4 quiz questions that together cover every family (one question may cover
    two related families).'
