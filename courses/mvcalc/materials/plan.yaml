  teaching:
    outcome: Represent vectors in 2D and 3D in component and standard-unit-vector form; compute sums, scalar multiples, magnitudes,
      unit vectors; locate points, distances and spheres in R^3.
    requires:
    - bg-algebra-trig
    introduces:
    - obj-s1-1
    - vector
    - space-coordinates
    reasoning: A vector is a magnitude plus direction independent of position; component operations follow from the geometry
      (parallelogram/triangle rule). Unit vector = v/|v|. 3D distance extends Pythagoras; a sphere is the set of points at
      fixed distance from a center.
    practice: Compute a unit vector in a given direction; resolve a force given by magnitude and angle; find center/radius
      of a sphere after completing the square.
    representation:
      job: Show head-to-tail addition and scalar multiplication so the component rule is visible
      needs:
      - figure:drawing
    boundary: Planes x=c, y=c, z=c and coordinate-plane descriptions are included briefly; lines and general planes defer
      to s1-4.
  directives: 'Subsection title: "Vectors in the Plane and in Space" in section "Vectors and the Geometry of Space". Source
    span — Section 2.1: PDF pages 98–111 (exposition), exercises from PDF page 112; Section 2.2: PDF pages 117–133 (exposition),
    exercises from PDF page 134. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach every listed family with at least one
    worked example, then 2–4 quiz questions that together cover every family (one question may cover two related families).'
