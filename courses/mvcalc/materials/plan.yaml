  teaching:
    outcome: Compute cross products and use them for orthogonal vectors, areas, volumes, coplanarity tests and torque.
    requires:
    - dot-product
    introduces:
    - obj-s1-3
    - cross-product
    - triple-scalar-product
    reasoning: u×v is orthogonal to both u and v with length |u||v|sin θ = parallelogram area; direction by right-hand rule;
      order matters (v×u = −u×v). Teach 2×2 and 3×3 determinant expansion as needed. u·(v×w) is the signed parallelepiped
      volume.
    practice: Cross product of two given vectors and check orthogonality via dot; triangle area from three points; coplanarity
      test.
    boundary: Determinants are taught only as a computational device here; no linear-algebra background assumed.
  directives: 'Subsection title: "The Cross Product" in section "Vectors and the Geometry of Space". Source span — Section
    2.4: PDF pages 157–170 (exposition), exercises from PDF page 171. Inspect the original PDF formulas and conditions; if support cannot be checked, leave source verification unresolved. Keep it lean: teach
