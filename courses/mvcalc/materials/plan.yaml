    - multivariable-limit
    reasoning: A limit must agree along every path into the point, so two disagreeing paths prove nonexistence but agreement
      along finitely many paths proves nothing. Continuous building blocks compose; polar substitution can show a limit exists
      when r→0 controls the expression.
    practice: Show nonexistence with y=mx; evaluate a removable limit by factoring; locate discontinuities.
    boundary: The formal δ-disk definition is stated and interpreted but ε–δ proofs are not assessed.
