title: "Double integrals in polar coordinates (dA = r dr dθ)"
term: "Polar Double Integral"
body: >-
  <p>When integrating over a region <m>R</m> bounded by rays and curves best described by polar coordinates, the double integral transforms as <m>\iint_R f(x, y)\, dA = \int_\alpha^\beta \int_{h_1(\theta)}^{h_2(\theta)} f(r \cos \theta, r \sin \theta)\, r\, dr\, d\theta</m>. The extra factor of <m>r</m> arises from the area element <m>dA = r\, dr\, d\theta</m> (the polar Jacobian). Polar coordinates are ideal when the domain involves disks, sectors, or rings, or when the integrand contains <m>x^2 + y^2 = r^2</m>. A classical application is evaluating the Gaussian integral <m>\int_{-\infty}^\infty e^{-x^2}\, dx = \sqrt{\pi}</m>.</p>
