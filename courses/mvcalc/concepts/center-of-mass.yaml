title: "Mass, moments and center of mass (lamina and solid)"
term: "Center of Mass"
body: >-
  <p>For a planar lamina with density <m>\rho(x, y)</m>, total mass is <m>m = \iint_D \rho(x, y)\, dA</m>, with moments about the coordinate axes <m>M_y = \iint_D x\rho\, dA</m> and <m>M_x = \iint_D y\rho\, dA</m>. The center of mass is the point <m>(\bar{x}, \bar{y}) = (M_y/m, M_x/m)</m>. For a 3D solid <m>E</m> with density <m>\rho(x, y, z)</m>, mass is <m>m = \iiint_E \rho\, dV</m> and the center of mass coordinates are <m>\bar{x} = M_{yz}/m</m>, <m>\bar{y} = M_{xz}/m</m>, and <m>\bar{z} = M_{xy}/m</m>. When density is constant, the center of mass is the geometric centroid.</p>
