title: "Tangent plane and linear approximation"
term: "Tangent Plane"
body: >-
  <p>The tangent plane to the surface <m>z = f(x, y)</m> at a point <m>(x_0, y_0, z_0)</m> where <m>f</m> is differentiable has equation <m>z - z_0 = f_x(x_0, y_0)(x - x_0) + f_y(x_0, y_0)(y - y_0)</m>. The linear approximation (or linearization) of <m>f</m> near <m>(x_0, y_0)</m> is <m>L(x, y) = f(x_0, y_0) + f_x(x_0, y_0)(x - x_0) + f_y(x_0, y_0)(y - y_0)</m>. For <m>(x, y)</m> close to <m>(x_0, y_0)</m>, <m>f(x, y) \approx L(x, y)</m>. This plane provides the best linear estimate of the surface near the point of tangency.</p>
