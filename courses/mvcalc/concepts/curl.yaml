title: "Curl"
term: "Curl"
body: >-
  <p>The curl of a three-dimensional vector field <m>\mathbf{F} = \langle P, Q, R \rangle</m> is the vector field defined by <m>\text{curl}\, \mathbf{F} = \nabla \times \mathbf{F} = \begin{vmatrix} \mathbf{i} & \mathbf{j} & \mathbf{k} \\ \frac{\partial}{\partial x} & \frac{\partial}{\partial y} & \frac{\partial}{\partial z} \\ P & Q & R \end{vmatrix} = \left\langle \frac{\partial R}{\partial y} - \frac{\partial Q}{\partial z},\; \frac{\partial P}{\partial z} - \frac{\partial R}{\partial x},\; \frac{\partial Q}{\partial x} - \frac{\partial P}{\partial y} \right\rangle</m>. Curl measures the microscopic rotational tendency (circulation density) of the field at a point. If <m>\text{curl}\, \mathbf{F} = \mathbf{0}</m>, the field is irrotational. A key identity is <m>\text{div}(\text{curl}\, \mathbf{F}) = 0</m> for any twice continuously differentiable field.</p>
