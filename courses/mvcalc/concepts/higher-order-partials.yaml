title: "Higher-order partial derivatives and Clairaut's theorem"
term: "Higher-Order Partials"
body: >-
  <p>Second-order partial derivatives are obtained by differentiating first partials, written as <m>f_{xx}</m>, <m>f_{yy}</m>, and mixed partials <m>f_{xy} = \frac{\partial^2 f}{\partial y \partial x}</m> and <m>f_{yx} = \frac{\partial^2 f}{\partial x \partial y}</m>. Clairaut's theorem states that if mixed partial derivatives <m>f_{xy}</m> and <m>f_{yx}</m> are continuous on an open disk containing <m>(a, b)</m>, then they are equal: <m>f_{xy}(a, b) = f_{yx}(a, b)</m>. Higher-order partials characterize surface curvature and verify solutions to partial differential equations such as Laplace's equation <m>f_{xx} + f_{yy} = 0</m>.</p>
