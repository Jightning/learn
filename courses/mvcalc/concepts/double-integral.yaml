title: "Double integrals as limits of Riemann sums; volume and average value"
term: "Double Integral"
body: >-
  <p>The double integral of a continuous function <m>f(x, y)</m> over a closed rectangle <m>R</m> is defined as the limit of Riemann double sums: <m>\iint_R f(x, y)\, dA = \lim_{\Delta x, \Delta y \to 0} \sum_{i=1}^m \sum_{j=1}^n f(x_{ij}^*, y_{ij}^*)\, \Delta A</m>. When <m>f(x, y) \ge 0</m>, this integral equals the volume of the solid region bounded between the surface <m>z = f(x, y)</m> and the region <m>R</m>. The average value of <m>f</m> over <m>R</m> is <m>f_{\text{avg}} = \frac{1}{\text{Area}(R)} \iint_R f(x, y)\, dA</m>. Double integrals generalize single-variable integration to two-dimensional domains.</p>
