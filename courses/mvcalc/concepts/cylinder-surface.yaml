title: "Cylinders and traces"
term: "Cylinder Surface"
body: >-
  <p>A cylinder is a surface generated by all parallel lines (rulings) passing through a given plane curve (the generating curve). In rectangular coordinates, an equation in which one variable is absent, such as <m>x^2 + y^2 = r^2</m> or <m>z = y^2</m>, represents a cylinder whose rulings are parallel to the axis of the missing variable. Cross sections formed by intersecting a surface with planes parallel to coordinate planes are called traces. Traces allow three-dimensional surfaces to be sketched and analyzed systematically from two-dimensional profiles.</p>
