title: "Fundamental theorem for line integrals"
term: "Fundamental Theorem for Line Integrals"
body: >-
  <p>The Fundamental Theorem for Line Integrals states that if <m>C</m> is a smooth curve from point <m>A</m> to point <m>B</m> and <m>f</m> is a continuously differentiable scalar function, then <m>\int_C \nabla f \cdot d\mathbf{r} = f(B) - f(A)</m>. This directly extends the Fundamental Theorem of Calculus to line integrals in space. It implies that for any conservative field <m>\mathbf{F} = \nabla f</m>, the integral depends solely on the values of the potential function at the endpoints. If <m>C</m> is closed (<m>A = B</m>), the line integral is identically zero.</p>
