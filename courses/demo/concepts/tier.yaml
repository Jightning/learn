term: Optional expansion
body: |-
  <p>Required reading contains every concept, premise, and reasoning step learners need. An optional expansion adds context or another perspective that can be skipped without leaving a gap in the main explanation.</p>
  <p>Study, Review, and Names present the same complete course in different forms. Optional blocks remain at their place in the reading and can be opened or closed there.</p>
src: Defined in §1.4
review: true
