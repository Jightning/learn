term: The two loops
body: |-
  <p>The subsection quiz is keyed by question <em>type</em>: can you derive this on the spot? Mixed Practice and Review draw from concept keyed items: do you still hold it later? All three surfaces use the same answer or skip, immediate feedback, and Continue flow.</p>
  <p>They meet at one seam: any answered concept enters Review. Mixed Practice and Review success never marks a subsection quiz type as covered.</p>
src: Defined in §3.1
