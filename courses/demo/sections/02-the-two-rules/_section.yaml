title: The two rules
blurb: |-
  The whole system serves two rules that pull against each other: state everything the reader needs, and state each thing exactly once. This section is where they are defined and reconciled; everything later is machinery built to keep both true at scale.
primer:
  - ask: |-
      Completeness says state every step; non-redundancy says state each thing once. If §4 needs an idea from §7, which rule is satisfied by <em>linking</em> to §7 instead of restating it?
    answer: |-
      Both
    why: |-
      <p>A link keeps §4 complete, because you can reach the idea from where you are, while adding no second copy of the explanation. The reference system is exactly how the two rules coexist.</p>
  - ask: |-
      Marking an explanation optional and recording its concept for spaced Review: are these the same decision?
    answer: |-
      No, they are separate decisions
    why: |-
      <p>No. Optional status controls whether supplementary explanation is open in the reading. Answering an item creates the retrieval record used to schedule a concept for Review.</p>
