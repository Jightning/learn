title: Using this site
blurb: |-
  Everything a reader needs, in one section. What a course is, what happens when you answer a question, how review decides what to show you, how much of a page you have to read, and where the navigation lives. The sections after this one explain why it is built this way; you can study a whole course without them.
primer:
  - ask: |-
      A quiz gives immediate feedback after you answer or skip. What moves you to the next question?
    answer: |-
      Press Continue after the feedback
    why: |-
      <p>Answer or skip, read the immediate feedback, then press Continue. Self-check cards reveal a model answer and offer Correct or Wrong.</p>
  - ask: |-
      You have read a section and answered its quiz. Nothing is due in review yet. Has something gone wrong?
    answer: |-
      No. Answered concepts enter Review automatically, then the schedule decides when they return
    why: |-
      <p>An answered concept enters the spaced schedule automatically. Reading alone does not create an answer history, so an untouched course legitimately owes nothing.</p>
