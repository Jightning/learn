title: Complete reading, at the pace you need
blocks:
  - t: p
    source: docs/code_truth.md §3d
    h: |-
      Every reading mode keeps the course's complete main path. The controls change how that material is presented, and optional expansions let you open supplementary explanation where it appears.

  - t: def
    source: src/lib/tiers.js
    term: Optional expansion
    label: A reading choice, not a missing lesson
    cat: reading-controls
    core: |-
      Required teaching stays in every reading mode; supplementary explanation is marked optional.
    h: |-
      <p>An optional expansion adds context or another perspective without carrying a premise or step needed by the main reading. Open or close it in place. The course remains complete when you leave it closed.</p>

  - t: key
    source: docs/material_truth.md M25
    label: Study, Review, and Names keep the same material
    cat: reading-controls
    core: |-
      Study shows the complete reading, Review closes development to its notes, and Names shows section and subsection titles.
    h: |-
      <p>These modes change presentation, not which required concepts are included. Study is the default for learning; Review helps you check a familiar idea; Names gives you a compact index. Return to Study whenever you need the full explanation.</p>

  - t: def
    source: src/lib/depth.js
    term: Reading mode
    label: A different view of the same course
    cat: reading-controls
    core: |-
      Full, Notes, and Index are presentation modes for complete course material.
    h: |-
      <p><b>Full</b> shows each block's development. <b>Notes</b> keeps its claim while closing the development. <b>Index</b> keeps names and headings. Closed material remains attached where it belongs; switching modes does not remove it from the course.</p>

  - t: key
    source: docs/architecture.md §3h
    label: Optional material stays visible at its place
    cat: reading-controls
    core: |-
      Optional expansions open where they occur in the reading.
    h: |-
      <p>You can decide whether to read an expansion without losing the surrounding explanation or changing the rest of the subsection. This keeps supplementary context available without making it a prerequisite for later teaching.</p>

  - t: table
    id: lanes-and-depths
    notes: open
    mono: true
    cap: Reading modes and optional expansions
    cat: reading-controls
    head: [choice, changes, required material]
    split: 2
    rows:
      - [Study, "Full presentation", complete]
      - [Review, "Notes presentation", complete]
      - [Names, "Index presentation", complete]
      - [Optional, "Supplementary explanation", "available in place"]

  - t: trap
    source: docs/code_truth.md T42
    label: Notes is not a substitute for a first reading
    cat: reading-controls
    gist: |-
      A provided outline can support recall without replacing a full explanation.
    h: |-
      <p>Measured against reading the full text, a provided outline raises memory (g&nbsp;=&nbsp;0.61) and does not reliably raise comprehension (g&nbsp;=&nbsp;0.34, not significant). Start with Study; use Review to check what you already understand.</p>

  - t: p
    source: docs/architecture.md §3d
    h: |-
      The content stays in its place as you move between modes. Required teaching remains present in each mode, and optional material is visibly marked and can be opened without losing your place.

  - t: note
    optional: true
    source: docs/material_truth.md M23
    label: Why optional content is available
    core: |-
      Optional explanation can preserve useful context without interrupting the required path.
    h: |-
      <p>The coherence principle reports that removing nonessential material can improve learning. Keeping an expansion available gives readers a choice, though the evidence does not establish that optional presentation itself improves learning.</p>

quiz:
  - type: Compare reading modes
    concept: tier
    q: |-
      You switch from Study to Review. What happens to the required concepts and explanations in the course?
    response:
      kind: self
      model: |-
        The same required material remains part of the course. Review presents it as notes rather than showing the full development.
    why: |-
      <p>Reading modes change presentation. They do not select a shorter required path.</p>
    verified: 2026-09-06

  - type: Apply the optional-content rule
    concept: tier
    q: |-
      An explanation contains a step needed to understand the next required result. Should it be marked optional?
    response:
      kind: self
      model: |-
        No. A step needed by the main reading belongs in the required path. Optional content adds context without carrying a necessary premise or step.
    why: |-
      <p>Readers should not need to guess whether closing an expansion will leave a gap in the lesson.</p>
    verified: 2026-09-06

  - type: Choose a reading mode
    concept: tier
    q: |-
      You know the material and want a compact view showing section and subsection titles. Which mode fits?
    response:
      kind: self
      model: |-
        Names, which uses the index presentation to show titles and headings.
    why: |-
      <p>Study and Review retain the complete reading at different levels of detail; Names provides a compact index.</p>
    verified: 2026-09-10
