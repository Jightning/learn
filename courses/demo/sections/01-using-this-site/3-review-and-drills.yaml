title: Mixed Practice and Review
blocks:
  - t: p
    source: docs/architecture.md §3c
    h: |-
      Quizzes ask whether you can produce an answer today. <b>Mixed Practice</b> lets you request more quiz questions from a chosen scope now. <b>Review</b> asks whether you still can later and serves only what the schedule says is due. The <b>Review</b> row in the sidebar carries the count of what is due across every course you have installed, and <code>r</code> opens it.

  - t: def
    cat: retrieval-surfaces
    source: docs/architecture.md §3c
    term: Practice item
    label: What review serves you
    core: |-
      A short retrieval item attached to a <b>concept</b>, available to practice and review.
    h: |-
      <p>A concept's practice bank holds several items, so the same idea comes back wearing a different surface each time. Mixed Practice lets you choose a subsection range and count; Review serves scheduled items. Answered concepts enter Review automatically, and misses or challenging outcomes receive more weight.</p>

  - t: key
    source: src/lib/retention.js
    label: How a concept gets into review
    cat: retrieval-surfaces
    core: |-
      Two doors let a concept into the review schedule, and reading is neither of them.
    h: |-
      <p>Any answered concept can enter Review automatically. You can also start Mixed Practice by choosing a subsection range and item count. An untouched course therefore has nothing due, and that is the system working, not an empty page.</p>

  - t: table
    # A three-way comparison is already the compact form: it puts the surfaces
    # side by side, which is the one thing a claim in prose cannot do. Its
    # caption names the topic without answering it, so closing it to that
    # caption would leave a row you have to open before it says anything.
    notes: open
    cap: What each surface is for
    head: [Surface, Asks, Chooses items by]
    rows:
      - [Subsection quiz, Can I produce this now?, one per question type in that subsection]
      - [Mixed Practice, Can I still do these mixed together?, your subsection range and count, weighted toward missed/due/challenging items]
      - [Review, Do I still hold this?, what the schedule says is due, across every course]

  - t: trap
    source: docs/architecture.md §3c
    label: Nothing due does not mean nothing to do
    core: |-
      An empty review queue means no concept has reached its next scheduled date yet.
    h: |-
      <p>Mixed Practice is available at any time. Choose a subsection range and count; the selector weights missed, due, and challenging items so "nothing is due" is never a reason to close the tab.</p>

  - t: p
    tier: depth
    source: docs/architecture.md §3c
    h: |-
      The schedule is per concept and cross-course: one queue, not one per subject. It survives closing the tab, and it is rebuilt by replaying your answer log, which is also what lets two of your own devices merge their history without either losing a session.

  - t: ex
    tier: apply
    source: docs/architecture.md §3c
    title: A concept's first week
    core: |-
      Criterion met in four sessions across three days, then the interval starts stretching.
    h: |-
      <ol>
        <li>Monday: you answer a question and miss it. The concept enters Review automatically.</li>
        <li>Tuesday: it is due. You answer it correctly and press Continue.</li>
        <li>Thursday, then the following week: later items return according to the schedule, with challenging items receiving extra weight.</li>
      </ol>

quiz:
  - type: Diagnose an empty queue
    concept: confidence
    q: |-
      A reader has read three sections and answered every quiz correctly. The review count says 0. Why?
    a: |-
      Nothing is due yet. Answered concepts enter the schedule automatically, but the first due date may still be later; reading alone does not create an answer history.
    why: |-
      <p>The schedule starts from answered items, so it has evidence about what the learner encountered. It does not fill with every concept merely because a course was opened.</p>
    verified: 2026-09-06

  - type: Choose the right surface
    concept: tier
    q: |-
      You want twenty questions on one procedure, right now, before an exam tomorrow. Where do you go?
    response:
      kind: multi
      choices:
        - text: Mixed Practice with the subsection range and count selected.
          why: Mixed Practice is the on-demand surface and weights missed, due, and challenging items.
        - text: Review, which serves only items due today.
          why: Review follows the schedule rather than an on-demand count.
        - text: Reading controls, which change the page depth.
          why: Reading controls do not ask retrieval questions.
      correct: [1]
    why: |-
      <p>The two are not interchangeable: review protects the long interval that makes memory durable, so it will not hand you twenty items because you asked. Practice exists for exactly the case where you want volume now.</p>
    verified: 2026-09-06
