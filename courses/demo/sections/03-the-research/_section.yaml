title: The research behind it
blurb: |-
  Why the site behaves the way §1 described. Two loops run over the same material and meet at a single one-way seam; optional explanations are a reader choice whose evidence is narrower than it may seem. This section states the findings and their limits.
primer:
  - ask: |-
      A reader answers a quiz item and gets it wrong. What happens in Review?
    answer: |-
      That concept is pulled into Review
    why: |-
      <p>An answered concept enters Review automatically, with misses and challenging outcomes weighted more heavily. Review success never marks a quiz type as covered.</p>
  - ask: |-
      A passage adds historical context that is not needed to understand any required result. Could it be optional?
    answer: |-
      Yes, if the required reading remains complete without it.
    why: |-
      <p>Optional content can add context, but it must not carry an examinable fact, premise, or reasoning step needed by the main reading.</p>
