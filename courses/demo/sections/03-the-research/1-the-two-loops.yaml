title: The two loops
blocks:
  - t: p
    source: docs/code_truth.md §3c
    h: |-
      The site runs two learning loops over the same material. They share the concept keys and nothing else. One asks whether you can produce an answer today; the other asks whether you still can in six weeks.

  - t: def
    source: docs/code_truth.md §3c
    term: The two loops
    cat: retrieval-surfaces
    core: |-
      Two retrieval pools use the same material: the subsection quiz is keyed by question type, while Mixed Practice and Review draw concept keyed items.
    h: |-
      <p>The quiz asks one item per type: can you derive this on the spot? Mixed Practice gives you more items on request, while Review serves scheduled concept items: do you still hold it?</p>

  - t: key
    source: docs/create_course.md §8
    label: The seam runs one way
    core: |-
      Any answered concept enters Review; success in Mixed Practice or Review never marks a quiz type as covered.
    h: |-
      <p><c k="retrieval-practice">Retrieval practice</c> is the shared mechanism of <c k="two-loops">the two loops</c>; the one-way direction is what keeps coverage and retention from being confused for each other.</p>

  - t: math
    label: What Review schedules against
    tex: R(t) = e^{-t/S}
    note: Recall probability R decays with time t since the last review; S is memory stability, which each successful spaced retrieval increases. The scheduler places the next review where R would fall to a fixed target.

  - t: ex
    source: docs/create_course.md §8
    title: An answered concept, routed
    core: |-
      Answering is what makes a concept eligible for Review; misses and challenging outcomes receive extra weight.
    h: |-
      <ol>
        <li>A reader answers a "separate the variables" quiz item and gets the sign wrong.</li>
        <li>The quiz records the type as attempted-and-failed, and the concept enters Review.</li>
        <li>The concept <code>separable-equation</code> is recruited into Review, and its practice items enter the schedule within a day.</li>
      </ol>

  - t: trap
    source: docs/material_truth.md M5
    label: Volume belongs in one loop only
    core: |-
      A second question of a type already covered is wrong in the quiz and right in Review.
    h: |-
      <p>A fifth “solve a linear IVP” question in a subsection quiz is a repeated type and the validator rejects it. Its place is the concept's practice bank, which carries no type-uniqueness rule and is available to Mixed Practice or scheduled Review.</p>

  - t: metric
    notes: open
    tier: depth
    value: <m>g = 0.51</m>
    label: practice testing vs. restudy (Adesope et al. 2017, 272 effects)
    source: docs/code_truth.md §17

  - t: metric
    notes: open
    tier: depth
    value: <m>g = 0.74</m>
    label: spaced retrieval vs. massed (Latimier et al. 2021)
    source: docs/code_truth.md §17

quiz:
  - type: Route a quiz result
    concept: two-loops
    q: |-
      A reader answers a quiz item correctly. Does its concept enter Review?
    stimulus:
      t: image
      src: assets/gallery.svg
      alt: Three bars labelled spine, depth, and apply
    a: |-
      Yes. Any answered concept enters Review; the scheduler can still weight missed items more heavily.
    why: |-
      <p>Correct answers still create an answer history. Review weighting distinguishes outcomes without asking the learner for a confidence prediction.</p>
    why_prompt: What makes a concept eligible for Review?
    verified: 2026-09-02

  - type: Choose the loop for more volume
    concept: two-loops
    q: |-
      An author wants ten practice problems on one procedure. Which loop takes them, and why not the other?
    response:
      kind: number
      value: 9
      tolerance: 0
      unit: rejected quiz items
    why: |-
      <p>The subsection quiz exists for coverage of question types; Mixed Practice and Review provide fluency through repeated retrieval. The constraints keep coverage and retention useful without forcing different interactions on the learner.</p>
    why_prompt: What rule in the subsection quiz blocks the other nine problems?
    verified: 2026-09-02

  - type: Spot the error
    concept: two-loops
    q: |-
      A course design doc says: "When a reader completes all three practice items for a concept, mark every quiz question that touches that concept as passed." What is wrong with this?
    a: |-
      It reverses the seam. Practice and Review success do not mark quiz types as covered; a successful concept item says nothing about whether the reader can handle each distinct question type.
    why: |-
      <p>The tempting idea is that mastering the concept should discharge the questions about it. But the quiz tracks <em>types</em>: forwards, backwards, boundary, error-spotting. Holding the concept in memory is not the same as being fluent in every form the examiner can use.</p>
    why_prompt: Which identity does the subsection quiz track that practice does not?
    verified: 2026-09-02
