title: Optional content and the evidence
blocks:
  - t: p
    source: docs/code_truth.md §3c
    h: |-
      <a href="#s1-4">§1.4</a> showed how reading modes present the complete required material. This subsection looks at the evidence for removing nonessential detail and asks what that evidence does, and does not, establish about optional explanations.

  - t: def
    source: docs/code_truth.md Trade-offs
    term: The coherence principle
    label: The finding behind concise explanations
    core: |-
      Removing interesting but nonessential material from a lesson can improve what a learner takes from it.
    h: |-
      <p>This finding supports careful editing of the required explanation. It does not by itself show that an optional expansion is better than presenting all the same information in one continuous reading.</p>

  - t: key
    source: docs/material_truth.md M23–M25
    label: Keep necessary reasoning in the main reading
    cat: reading-controls
    core:
      - State every result the learner needs in the required reading.
      - Keep its necessary premises and reasoning with it.
      - Mark only context that can be skipped without creating a gap as optional.
    h: |-
      <p>When two ideas depend on each other, teach them together. An optional expansion may explain a motivation, historical detail, or alternate perspective, but it should not carry a needed premise or step.</p>

  - t: table
    mono: true
    cap: Required teaching and optional explanation
    head: [question, required teaching, optional expansion]
    split: 2
    rows:
      - [Needed for a later result, yes, no]
      - [Part of the stated learning outcome, yes, no]
      - [Adds context without a needed step, no, possible]

  - t: ex
    source: docs/create_course.md §7.3
    title: Separate a result from its background
    core: |-
      The learner needs the result and the steps that support it; a longer derivation may be supplementary only if it is not needed to understand or use that result.
    h: |-
      <ol>
        <li>A lesson states a result learners are expected to use and explains the reasoning needed to apply it.</li>
        <li>A longer derivation adds background about where the result came from.</li>
        <li>Keep the result and application reasoning in the main reading. The background derivation can be optional only if the main explanation remains coherent without it.</li>
      </ol>

  - t: note
    optional: true
    source: docs/code_truth.md Trade-offs
    label: What the evidence does not settle
    core: |-
      The reported coherence effect was measured on material learners could not avoid; optional expansions have not been tested against a single-density reading.
    h: |-
      <p>The coherence principle reports an effect of <m>g = 0.37</m> to <m>0.41</m> for removing nonessential detail. Because that evidence concerns unavoidable material, it does not directly establish that optional presentation improves learning. Treat the format as a reader choice, not a proven learning intervention.</p>

  - t: p
    source: docs/material_truth.md M25
    h: |-
      The authoring rule is about completeness: if closing an expansion would hide an examinable fact, a premise, or a necessary step, that material belongs in the main reading. Content may be optional only when the surrounding explanation still works without it.

  - t: ex
    source: docs/create_course.md §7.3
    title: Test an optional expansion
    core: |-
      A reader should be able to close the expansion and continue without encountering a gap.
    h: |-
      <ol>
        <li>Read the required passage without the optional explanation.</li>
        <li>Check whether every later claim still has its premises and every stated outcome is still taught.</li>
        <li>If something is missing, move that needed material into the main reading. Keep only context that can be skipped safely.</li>
      </ol>

quiz:
  - type: Separate result and explanation
    concept: tier
    q: |-
      A method's uniqueness is a stated result learners must know. A proof explains why it is unique, but the proof is not part of the learning outcome. What belongs in the required reading?
    response:
      kind: self
      model: |-
        The uniqueness result and any reasoning needed to understand or use it belong in the required reading. The proof may be optional only if the main explanation remains complete without it.
    why: |-
      <p>Optional content cannot carry a result or necessary reasoning that the lesson promises to teach.</p>
    verified: 2026-09-02

  - type: Predict what optional means
    concept: tier
    q: |-
      A subsection has a required explanation and an optional historical note. The reader closes the note. What should the page still teach?
    response:
      kind: self
      model: |-
        The complete required explanation and every concept needed by later material. Closing the historical note should leave no gap in the lesson.
    why: |-
      <p>Optional status means supplementary, not part of the required chain of reasoning.</p>
    verified: 2026-09-02

  - type: Apply the completeness rule
    concept: tier
    q: |-
      An author marks a boundary case from a past final as optional to shorten the lesson. Is that appropriate?
    response:
      kind: self
      model: |-
        No. A result or case included in the learning outcome must remain in the required reading, even if it makes the lesson longer.
    why: |-
      <p>Optional content cannot remove material the course expects learners to know.</p>
    verified: 2026-09-02

  - type: Synthesis
    concept: tier
    q: |-
      <p>The coherence effect is measured on material a learner cannot skip.
      It does not establish whether optional expansions help compared with a
      single-density reading.</p>
      <p>Design an experiment that would test optional presentation. State what
      result would make you remove optional expansions from the site.</p>
    response:
      kind: self
      model: |-
        <p>A good answer compares the same material presented continuously with
        the same material divided into a required explanation and an expansion
        readers may open. It names outcomes relevant to learning, states how
        long-term understanding will be measured, and commits to a threshold
        in advance. If optional presentation produces no benefit or harms
        understanding on the required concepts, that would support removing
        the feature.</p>
        <p>Strong answers also note that readers choose whether to expand,
        which can make results hard to interpret unless the study accounts for
        who opened the material and why.</p>
    why: |-
      <p>The current evidence supports careful editing of required teaching. The experiment should test optional presentation directly rather than assume that the nearby coherence finding proves it.</p>
    verified: 2026-09-08
