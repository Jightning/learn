title: "Diagrams: graph, flow, timing"
blocks:
  - t: p
    source: docs/create_course.md §11.1
    h: |-
      Three kinds carry structure rather than magnitude: <b>graph</b> for nodes and edges, <b>flow</b> for an ordered procedure, <b>timing</b> for square-wave traces. The state machine below is figure <f k="loop-machine"/>.

  - t: def
    source: docs/material_truth.md M18
    term: Declarative figure
    cat: figure-kinds
    core: |-
      A figure written as a spec of nodes, steps or signals, and drawn by the engine rather than supplied as a picture.
    h: |-
      <p>It follows the theme, stays sharp at any size, and is edited by changing data. Preferred over a supplied image wherever the content can be described as data.</p>

  - t: figure
    cat: figure-kinds
    id: loop-machine
    kind: graph
    cap: "graph, circle layout: a concept's retention state, with one node ringed as \"here\""
    spec:
      layout: circle
      nodes:
        - {id: new, label: new, title: not yet seen, state: new, accent: 3}
        - {id: learning, label: learning, title: below the criterion count, state: learning, accent: 2}
        - {id: criterion, label: criterion, here: true, state: criterion, accent: 1}
        - {id: durable, label: durable, note: "3 spaced relearnings", state: durable, accent: 0}
      edges:
        - {from: new, to: learning, label: start}
        - {from: learning, to: criterion, label: 3 items}
        - {from: criterion, to: durable, label: "×3"}
        - {from: durable, to: learning, label: miss, curve: -0.22}
        - {from: criterion, to: criterion, self: true, label: review}

  - t: figure
    cat: figure-kinds
    tier: depth
    kind: graph
    cap: "graph, layered layout: ten nodes, so it keeps an intrinsic width and the figure frame scrolls rather than shrinking; long labels wrap and the node grows to fit them"
    spec:
      layout: layered
      nodes:
        - {id: yaml, label: "course YAML"}
        - {id: load, label: load}
        - {id: concepts, label: concepts}
        - {id: math, label: "render math"}
        - {id: figures, label: "compile figure functions"}
        - {id: validate, label: validate}
        - {id: materials, label: "generate materials"}
        - {id: build, label: build}
        - {id: contrast, label: "audit contrast"}
        - {id: page, label: "index.html", accent: 0}
      edges:
        - {from: yaml, to: load}
        - {from: load, to: concepts}
        - {from: load, to: math}
        - {from: concepts, to: validate}
        - {from: math, to: figures}
        - {from: figures, to: validate}
        - {from: validate, to: materials}
        - {from: validate, to: build}
        - {from: materials, to: build}
        - {from: build, to: contrast}
        - {from: build, to: page}
        - {from: contrast, to: page}

  - t: figure
    cat: figure-kinds
    kind: flow
    cap: "flow, row direction: the authoring procedure, each step with a note"
    spec:
      dir: row
      steps:
        - {label: Calibrate, note: write expectations.md first}
        - {label: Sequence, note: "sections and blurbs, no content"}
        - {label: Spine, note: only tier-spine blocks}
        - {label: Loops, note: "quizzes, then drills"}
        - {label: Verify, note: re-derive every answer}

  - t: figure
    cat: figure-kinds
    tier: depth
    kind: flow
    cap: "flow, column direction: the same phases stacked"
    spec:
      dir: col
      steps:
        - {label: Phase 1–3, note: "calibrate, sequence, concepts"}
        - {label: Phase 4–6, note: "spine, quizzes, drills"}
        - {label: Phase 7–8, note: "depth and apply, then verify"}

  - t: figure
    cat: figure-kinds
    kind: timing
    cap: "timing: a clock, an enable, and the gated output"
    spec:
      unit: 24
      signals:
        - {name: clk, wave: "01010101"}
        - {name: en, wave: "00111100"}
        - {name: out, wave: "00010100"}

  - t: figure
    cat: figure-kinds
    id: demo-circuit
    kind: circuit
    cap: "circuit: a battery drives a resistor through a closed loop"
    source: src/figures/circuit.js
    spec:
      w: 6
      h: 3
      wires:
        - {from: [0, 1], to: [1, 1]}
        - {from: [2, 1], to: [3, 1]}
        - {from: [4, 1], to: [5, 1]}
      parts:
        - {type: battery, x: 1.5, y: 1, label: B, value: 9 V}
        - {type: resistor, x: 3.5, y: 1, label: R, value: 1 kΩ}
      junctions: [[0, 1], [5, 1]]

  - t: figure
    cat: figure-kinds
    id: demo-drawing
    kind: drawing
    cap: "drawing: an annotated arrow makes direction explicit"
    source: src/figures/drawing.js
    spec:
      w: 420
      h: 140
      alt: An input box points to an output box with a labelled arrow
      shapes:
        - {type: rect, x: 24, y: 44, w: 110, h: 48, label: input}
        - {type: arrow, points: [[145, 68], [270, 68]], accent: 0, label: direction}
        - {type: rect, x: 282, y: 44, w: 110, h: 48, accent: 1, label: output}
        - {type: text, x: 174, y: 48, text: transform, accent: 0}

  - t: slides
    cat: figure-kinds
    id: demo-algorithm
    cap: "slides: one algorithm state per frame"
    source: src/components/Slides.jsx
    frames:
      - title: Read
        text: <p>Read the current item and compare it with the target.</p>
        figure:
          kind: drawing
          spec:
            w: 420
            h: 120
            alt: Three boxes with the middle box highlighted
            shapes:
              - {type: rect, x: 35, y: 35, w: 90, h: 45}
              - {type: rect, x: 165, y: 35, w: 90, h: 45, accent: 0}
              - {type: rect, x: 295, y: 35, w: 90, h: 45}
      - title: Narrow
        text: <p>Discard the half that cannot contain the target.</p>
        figure:
          kind: drawing
          spec:
            w: 420
            h: 120
            alt: An arrow points from the middle box toward the remaining range
            shapes:
              - {type: rect, x: 35, y: 35, w: 90, h: 45}
              - {type: arrow, points: [[175, 58], [280, 58]], accent: 1}
              - {type: rect, x: 295, y: 35, w: 90, h: 45, accent: 1}

  - t: note
    tier: depth
    source: src/figures/graph.js
    label: The other graph layouts
    core: |-
      A graph also takes <code>row</code> and <code>manual</code>; layered is the default past five nodes.
    h: |-
      <p>Besides <code>circle</code> and <code>layered</code>, a graph accepts <code>row</code> (evenly spaced on one line) and <code>manual</code> (each node carries its own <code>x</code>, <code>y</code>). Layered is the default past five nodes; it barycentre-sorts each column to cut edge crossings.</p>

quiz:
  - type: Pick the figure kind
    concept: tier
    q: |-
      You need to show the order of five processing steps, each with a one-line caveat. Which figure kind, and why not graph?
    a: |-
      flow. A procedure is an ordered list; flow numbers the steps without a glyph and puts the caveat in a sub-line. graph would imply the steps are peers connected by meaningful edges.
    why: |-
      <p>graph is for structure where the edges carry information. A linear procedure's "edges" are just "next", which flow expresses as sequence.</p>
    why_prompt: What would the edges in a graph version actually mean here?
    verified: 2026-09-02

  - type: Read a rendered figure
    concept: two-loops
    q: |-
      In figure <f k="loop-machine"/>, which transition leaves the "durable" state, and what causes it?
    a: |-
      durable → learning, caused by a miss.
    why: |-
      <p>Durability is revoked by a single failed retrieval. That is the curved edge back to "learning". Everything else flows forward toward durable; only a miss moves backward.</p>
    why_prompt: Which direction do all the other edges point, and what does that tell you?
    verified: 2026-09-02
