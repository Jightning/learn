title: Tables and code
blocks:
  - t: p
    source: docs/architecture.md §3
    h: |-
      A table is a table, not a special block type. Three switches change how it renders: <code>mono</code> for fixed-width centred cells that pick up the course's <code>valueStyles</code>, <code>map</code> for a per-block value-to-class map, and <code>split</code> for a ruled separator column.

  - t: def
    source: docs/architecture.md §3
    term: Configuration, not code
    cat: block-kinds
    core: |-
      Subject-specific rendering is data, not a renderer.
    h: |-
      <p>Cell colouring is <code>valueStyles</code>, code highlighting is <code>syntax</code> (a comment marker, keywords, and regex <code>patterns</code>), extra styling is <code>styles</code>. The build prints "no code" when a subject needs none of the <code>blocks.js</code> escape hatch.</p>
      <p>This is <c k="non-redundancy">non-redundancy</c> applied to the engine: one generic renderer per block type, configured per course, rather than one renderer written per subject. Optional explanations keep supplementary context near the complete required reading.</p>

  - t: note
    optional: true
    follows: true
    label: Why one renderer, not several
    core: |-
      One generic renderer keeps the same effect consistent across courses.
    h: |-
      <p>A renderer written per subject earns its keep once, at review, and charges it again on every course after: the same effect now means reading N implementations instead of one generic renderer plus N small config blocks.</p>

  - t: key
    follows: true
    cat: block-kinds
    source: docs/create_course.md §6.3
    label: An aside names one phrase, not the block
    core: |-
      <n k="fw-demo"><code>&lt;n k="…"&gt;</code> in the text and <code>asides.&lt;key&gt;</code> in the block are a matched pair</n>; the build fails if either exists without the other.
    h: |-
      <p>The note beside this block explains the marked sentence in both Study and Review. Hover or focus the note to highlight that sentence; otherwise the text looks unchanged. If a note refers to text that Review has closed, its “Show in the text” button opens that passage.</p>
    asides:
      fw-demo: |-
        <p>The anchor and this note are declared together, in the same block, so a rename of one cannot silently orphan the other.</p>

  - t: table
    cat: block-kinds
    cap: "plain table: no mono, no colouring"
    head: [block type, boxed, feeds the primer]
    rows:
      - ["def", "yes", "yes, via its term"]
      - ["key", "yes", "no"]
      - ["note", "ruled, not boxed", "no"]

  - t: table
    cat: block-kinds
    mono: true
    split: 2
    cap: "mono table: centred cells, course valueStyles applied, a rule after column 2"
    head: [feature, required, optional expansion]
    rows:
      - [definition, yes, "no"]
      - [necessary reasoning, yes, "no"]
      - [supplementary context, "no", yes]
      - [exam-testable, yes, "no"]

  - t: table
    cat: block-kinds
    optional: true
    map: {req: v-y, opt: v-a, gen: v-n}
    cap: "map table: a value-to-class map declared on the block itself"
    head: [material file, status]
    rows:
      - ["expectations.md", req]
      - ["syllabus.md", opt]
      - ["problems.md", gen]

  - t: code
    cat: block-kinds
    lang: yaml
    core: |-
      Highlighting is declared in <code>course.yaml</code>, so any language works with no renderer.
    src: |-
      # a subsection is data, highlighted by course.yaml syntax config
      optional: true         # only when this block adds supplementary detail
      concept: "tier"        # resolves to concepts/tier.yaml
      review: true
      see_also: §3.2         # matched by a custom regex pattern

  - t: p
    optional: true
    source: src/blocks/index.js
    h: |-
      The highlighter is one regex over the raw source: the comment marker, then string literals unless <code>strings: false</code>, then each course pattern, then <code>\b(keyword|…)\b</code>, joined into a single alternation and scanned once. Order is precedence. The earlier rule wins an overlap, so a keyword inside a comment stays part of the comment. Escaping happens per slice as the output is assembled, which is the point of scanning the raw text: a pass that re-read its own output would match the quoted class name in a span it had already emitted. A malformed pattern is dropped before the alternation is built, and <code>validate.mjs</code> reports it rather than leaving it silent.

quiz:
  - type: Choose the table mode
    concept: tier
    q: |-
      You want a truth table whose 0s and 1s are coloured the same way everywhere in the course. Which table switch?
    response:
      kind: self
      model: |-
        mono. It applies the course-level valueStyles, so every truth table in the course colours values identically.
    why: |-
      <p><code>map</code> would work but is per-block, so the mapping would have to be repeated on every table and could drift. <code>mono</code> centralises it.</p>
    verified: 2026-09-02

  - type: Add a language
    concept: non-redundancy
    q: |-
      A course needs Verilog code blocks highlighted. What is the smallest change, and where?
    response:
      kind: self
      model: |-
        Add a <code>syntax</code> block to that course's <code>course.yaml</code>: a comment marker, a keyword list, and any regex patterns. No renderer, no code.
    why: |-
      <p>Highlighting is configuration consumed by one generic highlighter. Writing a Verilog renderer would be new code for a job the data already does.</p>
    verified: 2026-09-02

  - type: Read an attached code listing
    concept: tier
    stimulus:
      - t: p
        h: 'This question carries its own YAML listing, so you can answer it in Review without returning to the lesson.'
      - t: code
        lang: yaml
        src: |-
          - t: note
            optional: true
            h: Optional background for curious readers.
      - t: note
        label: Reading rule
        h: '<p>The required path is complete. An <code>optional: true</code> block adds supplementary explanation.</p>'
      - t: p
        h: 'Check whether the listed block is optional. The listing and this supporting card are both attached to the question.'
    q: 'Which reading path does the listed block belong to?'
    response:
      kind: single
      correct: 2
      choices:
        - {text: 'Required reading', why: 'This would be the default only if the listing lacked an optional flag.'}
        - {text: 'Optional explanation', why: 'The listing marks this block optional, which indicates supplementary detail.'}
        - {text: 'A separate practice item', why: 'An optional block is still part of the reading, not a retrieval question.'}
    why: '<p>Code can be part of the problem itself. It occupies a full-width band; the supporting rule is a flat callout rather than another boxed card.</p>'
    verified: 2026-10-04
